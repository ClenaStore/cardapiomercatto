<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mercatto Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<meta name="theme-color" content="#b8860b">

<style>
:root{
  --gold:#b8860b;
  --dark:#0b0b0b;
  --card:#141414;
  --gray:#a8a8a8;
  --white:#fff;
}
*{box-sizing:border-box;font-family:Inter,sans-serif;}
body{margin:0;background:var(--dark);color:var(--white);overflow-x:hidden;}

header{background:var(--card);padding:1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;}
header h1{font-family:"Playfair Display",serif;margin:0;color:var(--gold);font-size:1.5rem;}
header button{background:var(--gold);border:none;color:#fff;padding:0.6rem 1rem;border-radius:8px;font-weight:600;cursor:pointer;}

#loginSection,#mainSection{display:none;min-height:100vh;transition:all .3s ease;}

#loginSection{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;}
#loginBox{background:var(--card);padding:2rem;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.5);width:90%;max-width:380px;}
#loginBox h2{font-family:"Playfair Display",serif;color:var(--gold);margin-bottom:1rem;}
#loginBox input{width:100%;padding:0.8rem;border:none;border-radius:8px;margin:0.4rem 0;background:#222;color:white;}
#loginBox button{width:100%;padding:0.8rem;background:var(--gold);border:none;border-radius:8px;color:white;font-weight:600;margin-top:0.6rem;cursor:pointer;}

.banner{background:url('https://i.imgur.com/XF9Z7Vd.jpg') center/cover no-repeat;height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--white);font-size:1.6rem;font-family:"Playfair Display",serif;text-shadow:0 3px 10px black;}
.banner span{background:rgba(0,0,0,0.4);padding:0.4rem 1rem;border-radius:8px;}

section{padding:1rem;}
h2{font-family:"Playfair Display",serif;color:var(--gold);margin-bottom:0.5rem;}

.categorias{display:flex;gap:10px;overflow-x:auto;padding:0.5rem 0;}
.categoria{flex:0 0 auto;background:var(--card);color:var(--gray);padding:0.6rem 1.2rem;border-radius:20px;cursor:pointer;white-space:nowrap;transition:0.3s;}
.categoria.active{background:var(--gold);color:#fff;}

.cardapio{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;}
.item{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.3);transition:transform .2s;}
.item:hover{transform:translateY(-3px);}
.item img{width:100%;height:130px;object-fit:cover;}
.item-info{padding:0.6rem;}
.item-info h3{margin:0;color:var(--white);font-size:1rem;}
.item-info p{margin:0.3rem 0;color:var(--gray);font-size:0.9rem;}
.item-info button{background:var(--gold);border:none;color:white;width:100%;padding:0.6rem;border-radius:8px;font-weight:600;cursor:pointer;}

.carrinho{position:fixed;bottom:0;left:0;width:100%;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1rem;border-top:1px solid #333;}
.carrinho span{font-size:1rem;}
.carrinho button{background:var(--gold);border:none;color:white;padding:0.6rem 1.2rem;border-radius:8px;font-weight:600;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;}
.modal-content{background:var(--card);border-radius:12px;padding:1rem;width:90%;max-width:400px;color:white;}
.modal h3{margin-top:0;color:var(--gold);}
.modal ul{list-style:none;padding:0;margin:0;max-height:250px;overflow-y:auto;}
.modal li{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:5px 0;}
.modal .total{font-weight:600;margin-top:10px;text-align:right;}
.modal button{margin-top:15px;width:100%;background:var(--gold);color:white;border:none;padding:0.8rem;border-radius:8px;font-weight:600;}
footer{text-align:center;padding:1rem;font-size:0.8rem;color:var(--gray);background:var(--card);margin-top:2rem;}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="loginSection">
  <div id="loginBox">
    <h2>🍝 Mercatto Delivery</h2>
    <input type="email" id="email" placeholder="Seu e-mail" required>
    <input type="password" id="senha" placeholder="Sua senha" required>
    <button id="btnLogin">Entrar</button>
    <p style="color:var(--gray);font-size:0.8rem;margin-top:10px;">Ainda não tem conta? <a href="#" style="color:var(--gold);text-decoration:none;">Cadastre-se</a></p>
  </div>
</section>

<!-- PRINCIPAL -->
<section id="mainSection">
  <header>
    <h1>Mercatto Delivery</h1>
    <button id="btnCarrinho">🛒 Carrinho</button>
  </header>

  <div class="banner"><span>O melhor da cozinha Mercatto na sua casa</span></div>

  <section>
    <h2>Categorias</h2>
    <div class="categorias" id="categorias"></div>
  </section>

  <section>
    <h2>Cardápio</h2>
    <div class="cardapio" id="cardapio"></div>
  </section>

  <div class="carrinho" id="carrinhoResumo">
    <span id="itensResumo">0 itens</span>
    <button id="finalizarPedido">Finalizar Pedido</button>
  </div>

  <footer>© 2025 Mercatto Delivery • Sabor & Elegância</footer>
</section>

<!-- MODAL CARRINHO -->
<div class="modal" id="modalCarrinho">
  <div class="modal-content">
    <h3>🛒 Seu Carrinho</h3>
    <ul id="listaCarrinho"></ul>
    <p class="total">Total: <span id="totalCarrinho">R$ 0,00</span></p>
    <button id="btnWhatsApp">Enviar via WhatsApp</button>
  </div>
</div>

<script>
// ---------- LOGIN ----------
const loginSection = document.getElementById("loginSection");
const mainSection = document.getElementById("mainSection");
document.getElementById("btnLogin").addEventListener("click", ()=>{
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  if(email && senha){
    localStorage.setItem("usuario",email);
    loginSection.style.display="none";
    mainSection.style.display="block";
  } else {
    alert("Preencha seu e-mail e senha.");
  }
});
if(localStorage.getItem("usuario")){
  loginSection.style.display="none";
  mainSection.style.display="block";
}

// ---------- CARDÁPIO ----------
const categorias=["Entradas","Carnes","Massas","Sobremesas","Bebidas"];
const produtos=[
  {nome:"Ancho Gold",preco:79.90,categoria:"Carnes",img:"https://i.imgur.com/WxvW5uE.jpg"},
  {nome:"Prime Rib Black",preco:89.90,categoria:"Carnes",img:"https://i.imgur.com/MrKQqO9.jpg"},
  {nome:"Camarão Mercatto",preco:69.90,categoria:"Carnes",img:"https://i.imgur.com/3cd3k9R.jpg"},
  {nome:"Tabua de Frios",preco:59.90,categoria:"Entradas",img:"https://i.imgur.com/lDrhY2v.jpg"},
  {nome:"Fettuccine Alfredo",preco:45.00,categoria:"Massas",img:"https://i.imgur.com/TPo3bQz.jpg"},
  {nome:"Risotto de Funghi",preco:52.00,categoria:"Massas",img:"https://i.imgur.com/jO8tOL1.jpg"},
  {nome:"Tiramisu Clássico",preco:22.00,categoria:"Sobremesas",img:"https://i.imgur.com/Lfw6I6g.jpg"},
  {nome:"Cheesecake Frutas Vermelhas",preco:24.00,categoria:"Sobremesas",img:"https://i.imgur.com/ABc7IWB.jpg"},
  {nome:"Vinho Tinto",preco:89.00,categoria:"Bebidas",img:"https://i.imgur.com/DWr2gEN.jpg"},
  {nome:"Suco Natural",preco:8.00,categoria:"Bebidas",img:"https://i.imgur.com/VIfxxC6.jpg"},
];
let carrinho=[];
const elCategorias=document.getElementById("categorias");
const elCardapio=document.getElementById("cardapio");
const elResumo=document.getElementById("itensResumo");
const elModal=document.getElementById("modalCarrinho");
const elLista=document.getElementById("listaCarrinho");
const elTotal=document.getElementById("totalCarrinho");

function renderCategorias(){
  elCategorias.innerHTML="";
  categorias.forEach(cat=>{
    const div=document.createElement("div");
    div.className="categoria";
    div.textContent=cat;
    div.onclick=()=>filtrar(cat);
    elCategorias.appendChild(div);
  });
}
function renderCardapio(lista){
  elCardapio.innerHTML="";
  lista.forEach(p=>{
    const card=document.createElement("div");
    card.className="item";
    card.innerHTML=`
      <img src="${p.img}">
      <div class="item-info">
        <h3>${p.nome}</h3>
        <p>R$ ${p.preco.toFixed(2)}</p>
        <button onclick="addCarrinho('${p.nome}')">Adicionar</button>
      </div>`;
    elCardapio.appendChild(card);
  });
}
function filtrar(cat){
  document.querySelectorAll(".categoria").forEach(c=>c.classList.remove("active"));
  [...elCategorias.children].find(c=>c.textContent===cat).classList.add("active");
  renderCardapio(produtos.filter(p=>p.categoria===cat));
}
function addCarrinho(nome){
  const item=produtos.find(p=>p.nome===nome);
  carrinho.push(item);
  elResumo.textContent=carrinho.length+" itens";
}
document.getElementById("btnCarrinho").onclick=()=>{
  elLista.innerHTML="";
  let total=0;
  carrinho.forEach(p=>{
    elLista.innerHTML+=`<li><span>${p.nome}</span><span>R$ ${p.preco.toFixed(2)}</span></li>`;
    total+=p.preco;
  });
  elTotal.textContent="R$ "+total.toFixed(2);
  elModal.style.display="flex";
};
elModal.onclick=(e)=>{if(e.target===elModal)elModal.style.display="none";};
document.getElementById("btnWhatsApp").onclick=()=>{
  let msg="🍝 *Pedido Mercatto Delivery*\n\n";
  carrinho.forEach(p=>msg+=`- ${p.nome} (R$ ${p.preco.toFixed(2)})\n`);
  let total=carrinho.reduce((t,p)=>t+p.preco,0).toFixed(2);
  msg+=`\n💰 *Total:* R$ ${total}\n👤 Cliente: ${localStorage.getItem("usuario")}`;
  window.open("https://wa.me/5571999999999?text="+encodeURIComponent(msg),"_blank");
};

renderCategorias();
renderCardapio(produtos);
filtrar("Carnes");
</script>

</body>
</html>
