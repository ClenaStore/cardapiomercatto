<style>
:root {
  --bg: #0b0f19;
  --card: #151d2f;
  --accent: #b8860b;
  --accent-light: #e4b64b;
  --text: #f8fafc;
  --muted: #94a3b8;
  --radius: 14px;
  --shadow: 0 6px 18px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
header{
  text-align:center;
  font-family:'Playfair Display',serif;
  background:linear-gradient(90deg,#b8860b,#d6a318);
  color:#fff;
  padding:18px;
  font-size:22px;
  letter-spacing:.3px;
  box-shadow:var(--shadow);
}
.banner img{
  width:100%;
  border-radius:0 0 var(--radius) var(--radius);
  box-shadow:var(--shadow);
}
.categorias{
  display:flex;overflow-x:auto;gap:10px;
  padding:10px;scrollbar-width:none;
  -ms-overflow-style:none;justify-content:center;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:var(--card);
  color:var(--accent-light);
  border:1px solid #2c3347;
  padding:8px 18px;border-radius:20px;
  cursor:pointer;font-weight:600;
  transition:.3s;box-shadow:var(--shadow);
}
.categorias button.active,
.categorias button:hover{
  background:var(--accent);
  color:#fff;
}
.container{
  padding:20px;max-width:800px;margin:auto;
}
h2{
  font-family:'Playfair Display',serif;
  color:var(--accent-light);
  border-bottom:1px solid #2a3245;
  padding-bottom:4px;margin-bottom:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .2s, box-shadow .3s;
  border:1px solid #2a3245;
}
.card:hover{
  transform:scale(1.02);
  box-shadow:0 0 15px rgba(184,134,11,0.4);
}
.card img{
  width:100%;height:130px;object-fit:cover;
}
.card-body{
  padding:10px;
}
.card-body h3{
  font-family:'Playfair Display',serif;
  font-size:16px;color:var(--accent-light);
}
.card-body p{
  font-size:13px;color:var(--muted);
  margin:4px 0;min-height:40px;
}
.card-body span{color:#fff;font-weight:600;}
button.add{
  background:var(--accent);
  color:#fff;border:none;
  width:100%;padding:8px;
  border-radius:var(--radius);
  margin-top:6px;cursor:pointer;
  font-weight:600;
  transition:.3s;
}
button.add:hover{opacity:.85;}

/* 🛒 CARRINHO */
#cart-btn{
  position:fixed;bottom:22px;right:22px;
  background:var(--accent);
  color:#fff;border:none;border-radius:50%;
  width:60px;height:60px;font-size:24px;
  box-shadow:var(--shadow);cursor:pointer;
  z-index:1000;
}
#cart-count{
  position:absolute;top:6px;right:6px;
  background:#a12f2f;color:#fff;
  font-size:12px;border-radius:50%;
  padding:2px 6px;
}
#cart-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;justify-content:center;align-items:center;
  z-index:2000;
}
#cart-modal.ativo{display:flex;}
.cart-content{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  width:90%;max-width:420px;
  max-height:90vh;overflow:auto;
  box-shadow:var(--shadow);
  border:1px solid #2c3347;
}
.cart-content h3{text-align:center;color:var(--accent-light);margin-bottom:10px;}
.item-line{display:flex;justify-content:space-between;margin:6px 0;}
.finalizar{
  background:var(--accent);
  color:#fff;width:100%;border:none;
  border-radius:var(--radius);
  padding:10px;font-weight:600;margin-top:10px;
}

/* 🔔 Overlay */
#overlay{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);
  flex-direction:column;z-index:9999;
}
#overlay img{width:80px;margin-bottom:16px;animation:pulse 1.3s infinite;}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
</style>
</head>

  {id: 90, nome: 'Pudim Golden', desc: 'Pudim dourado e cremoso, de sabor suave e textura aveludada que derrete na boca.', preco: 34.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'},
  {id: 91, nome: 'Cheesecake de Goiaba com Queijo', desc: 'Base de biscoito, creme de queijo e cobertura de goiabada, equilibrando o doce e o suave.', preco: 39.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'}
];

// 🛍️ Carrinho
let carrinho=[];
const categorias=[...new Set(produtos.map(p=>p.categoria))];
const categoriasDiv=document.getElementById('categorias');
const menuDiv=document.getElementById('menu');
const titulo=document.getElementById('tituloCategoria');

categorias.forEach((cat,i)=>{
  const btn=document.createElement('button');
  btn.textContent=cat;
  btn.onclick=()=>filtrar(cat);
  if(i===0)btn.classList.add('active');
  categoriasDiv.appendChild(btn);
});
filtrar(categorias[0]);

function filtrar(cat){
  titulo.textContent=cat;
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...categoriasDiv.children].find(b=>b.textContent===cat)?.classList.add('active');
  menuDiv.innerHTML='';
  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`
      <img src="${p.img}">
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <span>R$ ${p.preco.toFixed(2)}</span>
        <button class="add" onclick="add(${p.id})">Adicionar</button>
      </div>`;
    menuDiv.appendChild(c);
  });
}

function add(id){
  const prod=produtos.find(p=>p.id===id);
  const existe=carrinho.find(i=>i.id===id);
  if(existe)existe.qtd++; else carrinho.push({...prod,qtd:1});
  atualizarCarrinho();
}

function atualizarCarrinho(){
  document.getElementById('cart-count').innerText=carrinho.reduce((a,b)=>a+b.qtd,0);
  const items=document.getElementById('cart-items');
  items.innerHTML='';
  carrinho.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item-line">
        <span>${i.nome} x${i.qtd}</span>
        <span>R$ ${(i.qtd*i.preco).toFixed(2)}</span>
      </div>`;
  });
}

document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').classList.add('ativo');
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.classList.remove('ativo');};

// 💾 Formulário simplificado
function abrirForm(){
  const modal=document.getElementById('cart-modal');
  modal.innerHTML=`
    <div class="cart-content">
      <h3>Seus Dados</h3>
      <input id="nome" placeholder="Seu nome completo">
      <input id="email" placeholder="Seu e-mail">
      <input id="endereco" placeholder="Endereço completo">
      <button class="finalizar" onclick="salvarPedido()">Enviar Pedido</button>
    </div>`;
}

async function salvarPedido(){
  document.getElementById('overlay').style.display='flex';
  const dados={
    nome:document.getElementById('nome').value,
    email:document.getElementById('email').value,
    endereco:document.getElementById('endereco').value,
    itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),
    total:carrinho.reduce((s,i)=>s+i.qtd*i.preco,0),
    status:'PENDENTE'
  };

  try{
    await fetch('https://script.google.com/macros/s/AKfycbxcdhUN2YY-iSejxsxc7AWAG4t_DYKN7_tJkNrZ4O1acG5v0Wr0zUDMga2b2FiOs6Qa/exec',{
      method:'POST',
      body:JSON.stringify(dados)
    });
    document.getElementById('overlay').style.display='none';
    alert('✅ Pedido registrado! Você receberá uma notificação ao ser aprovado.');
    carrinho=[];
    atualizarCarrinho();
    document.getElementById('cart-modal').classList.remove('ativo');
  }catch(e){
    document.getElementById('overlay').style.display='none';
    alert('❌ Falha ao enviar pedido.');
  }
}
</script>

  navigator.serviceWorker.register('sw.js').then(reg=>{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        console.log('✅ Notificações ativas');
      }
    });
  });
}
</script>
