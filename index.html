<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mercatto Delivery</title>

<!-- 🧭 PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8860b">
<link rel="apple-touch-icon" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercatto Delivery">

<!-- 🖋️ FONTES -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--text:#f8fafc;
  --muted:#94a3b8;--accent:#b8860b;--accent2:#ffcc70;
  --radius:16px;--shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* 🔹 HEADER */
header{
  background:linear-gradient(90deg,#000,#1c1306);
  color:var(--accent2);text-align:center;
  padding:15px;font-family:'Playfair Display',serif;
  font-size:22px;letter-spacing:.5px;box-shadow:var(--shadow);
}

/* 🔹 BANNER + BUSCA */
.banner{width:100%;height:45vh;max-height:420px;overflow:hidden;position:relative;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.85);}
.banner h1{
  position:absolute;bottom:70px;left:20px;color:#fff;
  font-family:'Playfair Display',serif;font-size:28px;
  text-shadow:0 3px 8px rgba(0,0,0,.6);
}
.search-area{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:90%;display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border-radius:50px;padding:6px 14px;
}
.search-area input{
  flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:14px;
}
.search-area input::placeholder{color:#ccc;}
.search-area button{
  background:var(--accent);border:none;border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;box-shadow:var(--shadow);
  font-size:20px;position:relative;
}
#cart-count{
  position:absolute;top:-4px;right:-4px;background:#dc2626;
  color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;
}

/* 🔹 CATEGORIAS */
.categorias{
  display:flex;overflow-x:auto;padding:12px;gap:10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:#1e293b;border:1px solid var(--accent);
  color:var(--accent2);padding:10px 16px;border-radius:25px;
  cursor:pointer;font-weight:600;transition:.3s;white-space:nowrap;
}
.categorias button.active,.categorias button:hover{
  background:var(--accent);color:#000;transform:scale(1.05);
}

/* 🔹 GRADE DE PRODUTOS */
.container{width:100vw;margin:0;padding:0;max-width:100%;overflow-x:hidden;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;margin:0;padding:20px;box-sizing:border-box;}
.card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.06);
  transition:.25s;display:flex;flex-direction:column;height:280px;
}
.card:hover{transform:scale(1.03);border-color:var(--accent2);}
.card-media{width:100%;height:140px;overflow:hidden;background:#0e1623;}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;}
.card-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:10px 12px;}
.card-body h3{font-size:15px;color:var(--accent2);font-family:'Playfair Display',serif;margin-bottom:4px;}
.card-body p{color:var(--muted);font-size:13px;min-height:36px;margin-bottom:4px;}
.card-body span{display:block;margin-top:5px;color:var(--accent);font-weight:600;}
.card-body button{
  width:100%;background:var(--accent);color:#000;border:none;
  padding:8px;margin-top:auto;border-radius:25px;font-weight:600;
  cursor:pointer;transition:.2s;
}
.card-body button:hover{background:var(--accent2);}

/* 🔹 POPUP / CARRINHO / OVERLAY */
.popup{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;padding:20px;animation:fadeIn .3s;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.popup-content{
  background:#151d2f;border-radius:var(--radius);
  max-width:400px;width:100%;overflow:hidden;
  box-shadow:var(--shadow);position:relative;
}
.popup-body{padding:15px;max-height:70vh;overflow-y:auto;}
.popup-body h2{margin:0;font-family:'Playfair Display',serif;color:var(--accent2);}
.popup-body p{color:var(--muted);margin:8px 0;font-size:14px;}
.popup-body label{font-weight:600;font-size:13px;color:var(--accent2);}
.popup-body input,textarea,select{
  width:100%;margin-top:6px;padding:10px;background:#1e293b;
  border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;
}
.popup-body button{
  width:100%;padding:12px;margin-top:14px;border:none;border-radius:var(--radius);
  background:var(--accent);font-weight:600;cursor:pointer;
}
.popup-body button:hover{background:var(--accent2);}
.close-btn{
  position:absolute;top:15px;right:15px;background:none;
  border:none;color:var(--accent2);font-size:22px;cursor:pointer;
}

/* 🔹 OVERLAY (CARREGAMENTO) */
.overlay{
  display:none;align-items:center;justify-content:center;flex-direction:column;
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;
}
.overlay img{width:80px;margin-bottom:15px;}
</style>
</head>

<body>
<header>Mercatto Delivery</header>

<div class="banner">
  <img src="https://github.com/ClenaStore/cardapiomercatto/blob/main/paste/CAPA%20MERCATTO.png?raw=true">
  <div class="search-area">
    <input type="text" id="busca" placeholder="Buscar no cardápio..." oninput="buscarItem()">
    <button onclick="abrirUser()">👤</button>
    <button onclick="abrirCarrinho()">🛒<span id="cart-count">0</span></button>
  </div>
</div>

<div class="categorias" id="categorias"></div>
<div class="container"><div class="grid" id="menu"></div></div>

<div class="overlay" id="overlay">
  <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png">
  <p>Enviando seu pedido...</p>
</div>

<script>
/***************************************************
🍝 MERCATTO DELIVERY - CLIENTE (v4.0)
Login, cadastro, cardápio, carrinho, checkout.
***************************************************/
const ENDPOINT = "https://script.google.com/macros/s/AKfycbx3VNZMueKt97s6pgiHlO7qIvbwONtUtE4UpU2YfABUvMdfhjMOKkDFQ0IQNKn7q_E/exec";
const taxas = {"Vila Brasil":8,"São Caetano":7,"Primavera":9,"Jardim Europa":10,"Piatã":12};
let carrinho = JSON.parse(localStorage.getItem('mercatto_carrinho')||'[]');
atualizarCarrinho();

// 🔹 PRODUTOS (exemplo)
const produtos=[
{id:1,nome:"Ancho Gold",desc:"Corte Angus grelhado ao ponto, com purê trufado.",preco:79.90,img:"https://i.imgur.com/WxvW5uE.jpg",video:"",categoria:"Carnes"},
{id:2,nome:"Risoto de Camarão",desc:"Arroz arbóreo cremoso com camarões flambados.",preco:89.90,img:"https://i.imgur.com/3cd3k9R.jpg",video:"",categoria:"Massas"},
{id:3,nome:"Tábua de Frios",desc:"Queijos, presuntos e pães artesanais.",preco:59.90,img:"https://i.imgur.com/lDrhY2v.jpg",video:"",categoria:"Entradas"},
{id:4,nome:"Cheesecake",desc:"Cheesecake artesanal de frutas vermelhas.",preco:24.00,img:"https://i.imgur.com/ABc7IWB.jpg",video:"",categoria:"Sobremesas"},
{id:5,nome:"Vinho Tinto",desc:"Taça de vinho selecionado.",preco:29.90,img:"https://i.imgur.com/DWr2gEN.jpg",video:"",categoria:"Bebidas"}
];

// 🔹 CATEGORIAS
const categorias=[...new Set(produtos.map(p=>p.categoria))];
const catDiv=document.getElementById("categorias");
categorias.forEach((c,i)=>{
  const b=document.createElement("button");
  b.textContent=c;if(i===0)b.classList.add("active");
  b.onclick=()=>filtrar(c);catDiv.appendChild(b);
});
function filtrar(cat){
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...catDiv.children].find(b=>b.textContent===cat).classList.add('active');
  renderizar(produtos.filter(p=>p.categoria===cat));
}
filtrar(categorias[0]);

// 🔹 BUSCA
function buscarItem(){
  const t=document.getElementById("busca").value.toLowerCase();
  if(!t)return filtrar(document.querySelector(".categorias button.active").textContent);
  renderizar(produtos.filter(p=>p.nome.toLowerCase().includes(t)||p.desc.toLowerCase().includes(t)));
}

// 🔹 RENDER
function renderizar(lista){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  if(!lista.length){menu.innerHTML="<p style='text-align:center;color:#ccc;'>Nenhum item encontrado.</p>";return;}
  lista.forEach(p=>{
    const card=document.createElement("div");
    card.classList.add("card");
    const midia=p.video?`<video autoplay muted loop playsinline><source src="${p.video}" type="video/mp4"></video>`:`<img src="${p.img}" alt="${p.nome}">`;
    card.innerHTML=`
      <div class="card-media">${midia}</div>
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <span>R$ ${p.preco.toFixed(2)}</span>
        <button onclick="abrirPopup(${p.id})">Adicionar</button>
      </div>`;
    menu.appendChild(card);
  });
}

// 🔹 POPUP PRODUTO
function abrirPopup(id){
  const p=produtos.find(x=>x.id===id);
  const div=document.createElement("div");
  div.classList.add("popup");
  div.innerHTML=`
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>${p.nome}</h2>
      <p>${p.desc}</p>
      <label>Quantidade</label><input id="qtd" type="number" min="1" value="1">
      <label>Observação</label><textarea id="obs" placeholder="Ex: sem cebola..."></textarea>
      <button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

// 🔹 CARRINHO
function adicionar(id){
  const qtd=parseInt(document.getElementById('qtd').value)||1;
  const obs=document.getElementById('obs').value||'';
  const p=produtos.find(x=>x.id===id);
  carrinho.push({...p,qtd,obs});
  localStorage.setItem('mercatto_carrinho',JSON.stringify(carrinho));
  document.querySelector('.popup')?.remove();
  atualizarCarrinho();
  alert("✅ Adicionado ao carrinho!");
}
function atualizarCarrinho(){
  document.getElementById('cart-count').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
}
function abrirCarrinho(){
  if(!carrinho.length)return alert("Carrinho vazio!");
  const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const div=document.createElement("div");
  div.classList.add("popup");
  div.innerHTML=`
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>🛒 Seu Pedido</h2>
      ${carrinho.map((i,ix)=>`
      <div style="background:#1e2538;border-radius:10px;padding:8px;margin:8px 0;">
        <strong>${i.nome}</strong><br>
        ${i.qtd}x • R$ ${(i.qtd*i.preco).toFixed(2)}<br>
        <small>${i.obs||'Sem observações'}</small><br>
        <button style="margin-top:6px;background:#b91c1c;color:white;padding:4px 8px;border:none;border-radius:8px;" onclick="removerItem(${ix})">Remover</button>
      </div>`).join('')}
      <h3 style="text-align:right;color:var(--accent2);margin-top:10px;">Total: R$ ${total.toFixed(2)}</h3>
      <button onclick="finalizarPedido()">📦 Finalizar Pedido</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function removerItem(ix){carrinho.splice(ix,1);localStorage.setItem('mercatto_carrinho',JSON.stringify(carrinho));document.querySelector('.popup')?.remove();abrirCarrinho();atualizarCarrinho();}

// 🔹 FINALIZAR PEDIDO (com login)
function finalizarPedido(){
  const cliente=JSON.parse(localStorage.getItem('mercatto_cliente')||'null');
  if(!cliente){abrirCadastroLogin();return;}
  document.querySelectorAll('.popup').forEach(p=>p.remove());
  const c=cliente;
  const div=document.createElement("div");
  div.classList.add("popup");
  div.innerHTML=`
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>📍 Endereço de Entrega</h2>
      <label>Nome</label><input id="nome" value="${c.nome||''}">
      <label>Bairro</label><input id="bairro" value="${c.bairro||''}" onblur="mostrarResumo()">
      <label>Endereço</label><input id="endereco" value="${c.endereco||''}">
      <label>Pagamento</label>
      <select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
      <div id="resumo-total"></div>
      <button onclick="enviarPedido()">Enviar Pedido</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function mostrarResumo(){
  const bairro=document.getElementById('bairro').value.trim();
  const resumoDiv=document.getElementById('resumo-total');
  if(!(bairro in taxas)){resumoDiv.innerHTML='<p style="color:#f87171;">🚫 Não entregamos neste bairro.</p>';return;}
  const taxa=taxas[bairro];
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const total=subtotal+taxa;
  resumoDiv.innerHTML=`<p>Subtotal: R$ ${subtotal.toFixed(2)}<br>Entrega: R$ ${taxa.toFixed(2)}...<br><strong>Total: R$ ${total.toFixed(2)}</strong></p>`;
}

// 🔹 ENVIAR PEDIDO
async function enviarPedido(){
  const bairro=document.getElementById('bairro').value.trim();
  if(!(bairro in taxas))return alert("🚫 Bairro não atendido.");
  const cliente=JSON.parse(localStorage.getItem('mercatto_cliente')||'{}');
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const taxa=taxas[bairro];const total=subtotal+taxa;
  const payload={acao:"pedido",cliente,bairro,itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),subtotal,taxa,total};
  document.getElementById('overlay').style.display="flex";
  await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
  document.getElementById('overlay').style.display="none";
  alert(`✅ Pedido enviado!\nTotal: R$ ${total.toFixed(2)}`);
  carrinho=[];localStorage.setItem('mercatto_carrinho','[]');atualizarCarrinho();
}

// 🔹 LOGIN / CADASTRO
function abrirUser(){
  const c=JSON.parse(localStorage.getItem('mercatto_cliente')||'null');
  if(c){
    const div=document.createElement("div");
    div.classList.add("popup");
    div.innerHTML=`
    <div class="popup-content">
      <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
      <div class="popup-body" style="text-align:left;">
        <h2 style="text-align:center;color:var(--accent2);">${c.nome||''}</h2>
        <p><strong>Email:</strong> ${c.email||'-'}</p>
        <p><strong>Bairro:</strong> ${c.bairro||'-'}</p>
        <button onclick="sair()">🚪 Sair</button>
      </div>
    </div>`;
    document.body.appendChild(div);
  } else abrirCadastroLogin();
}
function abrirCadastroLogin(){
  const div=document.createElement("div");
  div.classList.add("popup");
  div.innerHTML=`
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>👤 Acesso ao Delivery</h2>
      <label>Email</label><input id="email" type="email">
      <label>Senha</label><input id="senha" type="password">
      <button onclick="fazerLogin()">Entrar</button>
      <hr>
      <button onclick="abrirCadastro()">Criar Conta</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
async function fazerLogin(){
  const e=email.value.trim(),s=senha.value.trim();
  if(!e||!s)return alert("Preencha email e senha.");
  const r=await fetch(`${ENDPOINT}?acao=loginUsuario&email=${e}&senha=${s}`);
  const d=await r.json();
  if(d.sucesso){localStorage.setItem('mercatto_cliente',JSON.stringify(d.usuario));alert("✅ Login realizado!");location.reload();}
  else alert("❌ Email ou senha incorretos.");
}
function abrirCadastro(){
  document.querySelector('.popup')?.remove();
  const div=document.createElement("div");
  div.classList.add("popup");
  div.innerHTML=`
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>📋 Criar Conta</h2>
      <input id="nome" placeholder="Nome completo">
      <input id="email" type="email" placeholder="Email">
      <input id="senha" type="password" placeholder="Senha">
      <input id="bairro" placeholder="Bairro">
      <input id="endereco" placeholder="Endereço">
      <button onclick="registrar()">Salvar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
async function registrar(){
  const d={acao:"registrarUsuario",nome:nome.value,email:email.value,senha:senha.value,bairro:bairro.value,endereco:endereco.value};
  const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(d)});
  const t=await r.text();
  if(t.toLowerCase().includes("sucesso")){alert("✅ Conta criada!");localStorage.setItem('mercatto_cliente',JSON.stringify(d));document.querySelector('.popup')?.remove();}
  else alert("Erro: "+t);
}
function sair(){localStorage.removeItem('mercatto_cliente');alert("Você saiu.");location.reload();}
</script>
</body>
</html>
