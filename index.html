<style>
:root{

  --radius:14px;--shadow:0 6px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;scroll-behavior:smooth;
}
header{
  background:linear-gradient(90deg,#000,#1c1306);
  color:var(--accent2);text-align:center;padding:18px;
  font-family:'Playfair Display',serif;font-size:22px;
  box-shadow:var(--shadow);
}
.banner{position:relative;width:100%;height:90vh;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(55%);transition:transform 2s ease;}
.banner:hover img{transform:scale(1.05);}
.banner h1{
  position:absolute;bottom:25px;left:20px;right:20px;
  font-size:30px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.6);
  font-family:'Playfair Display',serif;line-height:1.3;
}

.categorias{
  display:flex;overflow-x:auto;gap:10px;
  padding:14px 10px;margin:15px auto;
  scrollbar-width:none;scroll-behavior:smooth;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:#1f2937;border:1px solid var(--accent);
  color:var(--accent2);padding:10px 18px;border-radius:25px;
  font-weight:600;cursor:pointer;transition:all .3s;
}
.categorias button.active,.categorias button:hover{
  background:var(--accent);color:#000;transform:scale(1.05);
}

.container{padding:10px 15px;max-width:1000px;margin:0 auto;}
h2{margin:20px 0 10px;color:var(--accent2);
  font-family:'Playfair Display',serif;text-align:center;font-size:22px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.card{
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  transition:all .25s ease;border:1px solid rgba(255,255,255,.05);
}
.card:hover{transform:scale(1.03);border-color:var(--accent2);}
.card img{width:100%;height:130px;object-fit:cover;}
.card-body{padding:10px 12px;}
.card-body h3{font-size:15px;font-family:'Playfair Display',serif;color:var(--accent2);margin-bottom:4px;}
.card-body p{font-size:13px;color:var(--muted);min-height:38px;}
.card-body span{display:block;color:var(--accent);font-weight:600;margin-top:5px;}
.card-body button{
  background:var(--accent);color:#000;border:none;width:100%;
  padding:8px;margin-top:8px;border-radius:var(--radius);
  font-weight:600;cursor:pointer;transition:all .2s;
}
.card-body button:hover{background:var(--accent2);}

#cart-btn{
  position:fixed;bottom:20px;right:20px;background:var(--accent);
  color:#000;border:none;border-radius:50%;
  width:65px;height:65px;box-shadow:var(--shadow);
  font-size:26px;cursor:pointer;z-index:20;transition:transform .3s;
}
#cart-btn:hover{transform:scale(1.1);}
#cart-count{
  position:absolute;top:5px;right:5px;background:#dc2626;color:#fff;
  font-size:12px;border-radius:50%;padding:2px 6px;
}

#cart-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:none;justify-content:center;align-items:center;z-index:999;
}
.cart-content{
  background:#111827;width:92%;max-width:440px;border-radius:var(--radius);
  padding:20px;color:var(--text);box-shadow:var(--shadow);
}
.cart-content h3{text-align:center;color:var(--accent2);font-family:'Playfair Display',serif;}
.cart-body{max-height:60vh;overflow-y:auto;margin-top:10px;}
.item-line{display:flex;justify-content:space-between;align-items:center;margin:6px 0;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1);}
.finalizar{
  background:var(--accent);color:#000;border:none;width:100%;
  padding:12px;margin-top:14px;border-radius:var(--radius);
  font-weight:600;cursor:pointer;
}
.finalizar:hover{background:var(--accent2);}

.form-popup{
  position:fixed;inset:0;background:#0f172a;overflow-y:auto;
  padding:20px;z-index:9999;animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.form-popup h2{color:var(--accent2);text-align:center;font-family:'Playfair Display',serif;margin-bottom:10px;}
.form-popup input,.form-popup select{

.form-popup label{font-weight:600;font-size:13px;color:var(--accent2);}
.form-popup button{
  background:var(--accent);color:#000;border:none;padding:12px;width:100%;

.form-popup button:hover{background:var(--accent2);}

  background:none;color:var(--accent2);border:none;

const categoriasUnicas=[...new Set(produtos.map(p=>p.categoria))];
const categoriasDiv=document.getElementById('categorias'),menuDiv=document.getElementById('menu');
categoriasUnicas.forEach((cat,i)=>{const b=document.createElement('button');b.textContent=cat;b.onclick=()=>filtrarCategoria(cat);if(i===0)b.classList.add('active');categoriasDiv.appendChild(b);});
filtrarCategoria(categoriasUnicas[0]);

// 🎠 Rolagem automática das categorias
let scrollDir=1;
setInterval(()=>{
  categoriasDiv.scrollLeft+=scrollDir;
  if(categoriasDiv.scrollLeft+categoriasDiv.clientWidth>=categoriasDiv.scrollWidth||categoriasDiv.scrollLeft<=0){scrollDir*=-1;}
},50);

function filtrarCategoria(cat){
  categoriaAtiva=cat;
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...categoriasDiv.children].find(b=>b.textContent===cat)?.classList.add('active');
  menuDiv.innerHTML='';
  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card sr-item';
    c.innerHTML=`<img src="${p.img}"><div class="card-body"><h3>${p.nome}</h3><p>${p.desc}</p><span>R$ ${p.preco.toFixed(2)}</span><button onclick="abrirAdd(${p.id})">Adicionar</button></div>`;
    menuDiv.appendChild(c);
  });
  ScrollReveal().reveal('.sr-item',{distance:'30px',origin:'bottom',duration:600,interval:100});
}

function abrirAdd(id){
  const p=produtos.find(x=>x.id===id);
  const m=document.createElement('div');
  m.classList.add('form-popup');
  m.innerHTML=`
  <button class="close-btn" onclick="this.parentElement.remove()">✖</button>
  <h2>${p.nome}</h2><p>${p.desc}</p>
  <label>Quantidade</label><input id="qtdTemp" type="number" min="1" value="1">
  <label>Observação</label><input id="obsTemp" placeholder="(opcional)">
  <div class="resumo-box" id="resumoPedido"></div>
  <div class="sugestoes" id="sugs"></div>
  <button onclick="confirmarAdd(${p.id})">Adicionar</button>`;
  document.body.appendChild(m);
  mostrarSugestoes();
  atualizarResumo();
}
function atualizarResumo(){
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  document.getElementById('resumoPedido').innerHTML=`<strong>Resumo:</strong><br>Itens: ${carrinho.length}<br>Subtotal: R$ ${subtotal.toFixed(2)}`;
}
function confirmarAdd(id){
  const qtd=parseInt(document.getElementById('qtdTemp').value)||1;
  const obs=document.getElementById('obsTemp').value||'';
  const p=produtos.find(x=>x.id===id);
  const existe=carrinho.find(i=>i.id===id&&i.obs===obs);
  if(existe){existe.qtd+=qtd;}else{carrinho.push({...p,qtd,obs});}
  document.querySelectorAll('.form-popup').forEach(x=>x.remove());
  renderCarrinho();
}
function mostrarSugestoes(){
  const div=document.getElementById('sugs');
  if(!div)return;
  const idsNoCarrinho=carrinho.map(c=>c.id);
  const sugestoes=produtos.filter(p=>!idsNoCarrinho.includes(p.id)).slice(0,2);
  div.innerHTML='<h4>🍽️ Sugestões</h4>'+sugestoes.map(s=>`
    <div class="mini-card"><img src="${s.img}"><div><strong>${s.nome}</strong><br><small>${s.desc}</small><br><button onclick="addSugestao(${s.id})">Adicionar</button></div></div>`).join('');
}
function addSugestao(id){
  confirmarAdd(id);
  const sugDiv=document.getElementById('sugs');
  if(sugDiv) mostrarSugestoes();
}
function renderCarrinho(){
  const div=document.getElementById('cart-items');
  const btn=document.getElementById('btnFinalizar');
  div.innerHTML='';
  carrinho.forEach((i,idx)=>{
    div.innerHTML+=`<div class="item-line"><span>${i.nome} x${i.qtd}</span><span>R$ ${(i.preco*i.qtd).toFixed(2)}</span><button onclick="remover(${idx})">✖</button></div><small>Obs: ${i.obs||'-'}</small>`;
  });
  document.getElementById('cart-count').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
  btn.style.display=carrinho.length?'block':'none';
}
function remover(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};
document.getElementById('btnFinalizar').onclick=abrirForm;

function abrirForm(){
  const saved=JSON.parse(localStorage.getItem("cliente")||"{}");
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const f=document.createElement('div');
  f.classList.add('form-popup');
  f.innerHTML=`
  <button class="close-btn" onclick="this.parentElement.remove()">✖</button>
  <h2>📋 Finalizar Pedido</h2>
  <div class="resumo-box"><strong>Resumo:</strong><br>${carrinho.map(c=>c.nome+" x"+c.qtd).join(", ")}<br>Total: R$ ${subtotal.toFixed(2)}</div>
  <label>Nome</label><input id="nome" value="${saved.nome||''}">
  <label>E-mail</label><input id="email" value="${saved.email||''}">
  <label>WhatsApp</label><input id="whats" value="${saved.whats||''}">
  <label>CEP</label><input id="cep" value="${saved.cep||''}" onblur="buscarEndereco()">
  <label>Endereço</label><input id="endereco" value="${saved.endereco||''}">
  <label>Número</label><input id="numero" value="${saved.numero||''}">
  <label>Bairro</label><input id="bairro" value="${saved.bairro||''}">
  <label>Complemento</label><input id="complemento" value="${saved.complemento||''}">
  <label>Pagamento</label><select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
  <label>Troco</label><input id="troco" value="${saved.troco||''}">
  <div class="sugestoes" id="sugs"></div>
  <button onclick="salvarCliente()">Enviar Pedido</button>`;
  document.body.appendChild(f);
  mostrarSugestoes();
}

function salvarCliente(){
  const cliente={
    nome:nome.value,email:email.value,whats:whats.value,cep:cep.value,endereco:endereco.value,
    numero:numero.value,bairro:bairro.value,complemento:complemento.value,
    pagamento:pagamento.value,troco:troco.value
  };
  localStorage.setItem("cliente",JSON.stringify(cliente));
  enviarPedido(cliente);
}

async function buscarEndereco(){
  const cep=document.getElementById('cep').value.replace(/\D/g,'');
  if(cep.length!==8)return;
  const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  const d=await r.json();
  if(!d.erro){document.getElementById('endereco').value=d.logradouro||'';document.getElementById('bairro').value=d.bairro||'';}
}
function taxaPorBairro(b){const t={Centro:5,"Vila Brasil":8,"Santa Luzia":10};return t[b]||8;}
async function enviarPedido(cliente){
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const taxa=taxaPorBairro(cliente.bairro);
  const total=subtotal+taxa;
  const payload={acao:"adicionar",...cliente,itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),observacoes:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),subtotal,taxa,total};
  document.getElementById('overlay').style.display='flex';
  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    const t=await r.text();
    document.getElementById('overlay').style.display='none';
    alert(t.includes('ok')?"✅ Pedido enviado com sucesso!":"Erro ao enviar pedido.");location.reload();
  }catch(e){
    document.getElementById('overlay').style.display='none';
    alert("⚠️ Erro de conexão.");
  }
}
</script>
