<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mercatto Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<meta name="theme-color" content="#b8860b">
<style>
:root{
  --gold:#b8860b;--dark:#0b0b0b;--gray:#f7f7f7;--white:#fff;
}
*{box-sizing:border-box;font-family:Inter,sans-serif;}
body{margin:0;background:var(--gray);color:#222;}
header{background:var(--dark);color:var(--gold);padding:1rem;display:flex;justify-content:space-between;align-items:center;}
header h1{font-family:"Playfair Display",serif;font-size:1.5rem;margin:0;}
header button{background:var(--gold);border:none;color:#fff;padding:0.6rem 1rem;border-radius:8px;font-weight:600;cursor:pointer;}

.banner{background:url('https://i.imgur.com/8w0tRzN.jpg') center/cover no-repeat;height:220px;display:flex;align-items:center;justify-content:center;color:white;text-shadow:0 2px 10px black;font-family:"Playfair Display",serif;font-size:2rem;}

section{padding:1rem;}
h2{font-family:"Playfair Display",serif;color:var(--dark);margin-bottom:0.5rem;}

.categorias{display:flex;gap:10px;overflow-x:auto;padding:0.5rem;}
.categoria{flex:0 0 auto;background:var(--dark);color:var(--gold);padding:0.6rem 1rem;border-radius:20px;cursor:pointer;white-space:nowrap;}
.categoria.active{background:var(--gold);color:#fff;}

.cardapio{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;}
.item{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.item img{width:100%;height:120px;object-fit:cover;}
.item-info{padding:0.5rem;}
.item-info h3{margin:0;font-size:1rem;}
.item-info p{margin:0.3rem 0;color:#555;font-size:0.9rem;}
.item-info button{background:var(--gold);color:white;border:none;width:100%;padding:0.5rem;border-radius:8px;cursor:pointer;font-weight:600;}

.carrinho{position:fixed;bottom:0;left:0;width:100%;background:var(--dark);color:white;display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1rem;}
.carrinho span{font-size:1rem;}
.carrinho button{background:var(--gold);border:none;color:white;padding:0.6rem 1.2rem;border-radius:8px;font-weight:600;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;}
.modal-content{background:white;border-radius:10px;padding:1rem;width:90%;max-width:400px;}
.modal h3{margin-top:0;}
.modal ul{list-style:none;padding:0;margin:0;}
.modal li{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:5px 0;}
.modal .total{font-weight:600;margin-top:10px;}
.modal button{margin-top:15px;width:100%;background:var(--gold);color:white;border:none;padding:0.6rem;border-radius:8px;font-weight:600;}
</style>
</head>
<body>

<header>
  <h1>🍝 Mercatto Delivery</h1>
  <button id="verCarrinho">🛒 Ver Carrinho</button>
</header>

<div class="banner">Sabor & Elegância em Casa</div>

<section>
  <h2>Categorias</h2>
  <div class="categorias" id="categorias"></div>
</section>

<section>
  <h2>Cardápio</h2>
  <div class="cardapio" id="cardapio"></div>
</section>

<div class="carrinho" id="carrinhoResumo">
  <span id="itensResumo">0 itens</span>
  <button id="finalizarPedido">Finalizar</button>
</div>

<div class="modal" id="modalCarrinho">
  <div class="modal-content">
    <h3>🛒 Seu Carrinho</h3>
    <ul id="listaCarrinho"></ul>
    <p class="total">Total: <span id="totalCarrinho">R$ 0,00</span></p>
    <button id="enviarWhatsApp">Enviar Pedido via WhatsApp</button>
  </div>
</div>

<script>
const categorias = [
  "Entradas","Pratos Principais","Sobremesas","Bebidas"
];
const produtos = [
  {nome:"Ancho Gold",preco:79.90,categoria:"Pratos Principais",img:"https://i.imgur.com/WxvW5uE.jpg"},
  {nome:"Parrilla Premium",preco:89.90,categoria:"Pratos Principais",img:"https://i.imgur.com/MrKQqO9.jpg"},
  {nome:"Camarão Mercatto",preco:69.90,categoria:"Pratos Principais",img:"https://i.imgur.com/3cd3k9R.jpg"},
  {nome:"Tabua de Frios",preco:59.90,categoria:"Entradas",img:"https://i.imgur.com/lDrhY2v.jpg"},
  {nome:"Cheesecake de Frutas Vermelhas",preco:22.00,categoria:"Sobremesas",img:"https://i.imgur.com/ABc7IWB.jpg"},
  {nome:"Tiramisu Clássico",preco:20.00,categoria:"Sobremesas",img:"https://i.imgur.com/Lfw6I6g.jpg"},
  {nome:"Suco Natural",preco:8.00,categoria:"Bebidas",img:"https://i.imgur.com/VIfxxC6.jpg"},
  {nome:"Refrigerante Lata",preco:7.00,categoria:"Bebidas",img:"https://i.imgur.com/6qGJv9E.jpg"}
];

let carrinho = [];
const elCategorias = document.getElementById('categorias');
const elCardapio = document.getElementById('cardapio');
const elResumo = document.getElementById('itensResumo');
const elModal = document.getElementById('modalCarrinho');
const elLista = document.getElementById('listaCarrinho');
const elTotal = document.getElementById('totalCarrinho');

function renderCategorias(){
  elCategorias.innerHTML = "";
  categorias.forEach(cat=>{
    const div=document.createElement('div');
    div.className='categoria';
    div.textContent=cat;
    div.onclick=()=>filtrarCategoria(cat);
    elCategorias.appendChild(div);
  });
}
function renderCardapio(lista){
  elCardapio.innerHTML="";
  lista.forEach(p=>{
    const card=document.createElement('div');
    card.className='item';
    card.innerHTML=`
      <img src="${p.img}">
      <div class="item-info">
        <h3>${p.nome}</h3>
        <p>R$ ${p.preco.toFixed(2)}</p>
        <button onclick="adicionarCarrinho('${p.nome}')">Adicionar</button>
      </div>`;
    elCardapio.appendChild(card);
  });
}
function filtrarCategoria(cat){
  document.querySelectorAll('.categoria').forEach(c=>c.classList.remove('active'));
  [...elCategorias.children].find(c=>c.textContent===cat).classList.add('active');
  renderCardapio(produtos.filter(p=>p.categoria===cat));
}
function adicionarCarrinho(nome){
  const item = produtos.find(p=>p.nome===nome);
  carrinho.push(item);
  atualizarResumo();
}
function atualizarResumo(){
  elResumo.textContent = carrinho.length+" itens";
}
document.getElementById('verCarrinho').onclick=()=>{
  elLista.innerHTML="";
  let total=0;
  carrinho.forEach(p=>{
    elLista.innerHTML+=`<li><span>${p.nome}</span><span>R$ ${p.preco.toFixed(2)}</span></li>`;
    total+=p.preco;
  });
  elTotal.textContent="R$ "+total.toFixed(2);
  elModal.style.display="flex";
};
elModal.onclick=(e)=>{if(e.target===elModal)elModal.style.display="none";};
document.getElementById('enviarWhatsApp').onclick=()=>{
  let msg="🍝 *Pedido Mercatto Delivery*\n\n";
  carrinho.forEach(p=>msg+=`- ${p.nome} (R$ ${p.preco.toFixed(2)})\n`);
  let total=carrinho.reduce((t,p)=>t+p.preco,0).toFixed(2);
  msg+=`\n💰 *Total:* R$ ${total}`;
  const url="https://wa.me/5571999999999?text="+encodeURIComponent(msg);
  window.open(url,'_blank');
};

renderCategorias();
renderCardapio(produtos);
filtrarCategoria("Pratos Principais");
</script>

</body>
</html>
