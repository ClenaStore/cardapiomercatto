<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--text:#f8fafc;
  --muted:#94a3b8;--accent:#b8860b;--accent2:#ffcc70;
  --radius:16px;--shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
header{
  background:linear-gradient(90deg,#000,#1c1306);
  color:var(--accent2);text-align:center;
  padding:15px;font-family:'Playfair Display',serif;
  font-size:22px;letter-spacing:.5px;box-shadow:var(--shadow);
}
.banner{width:100%;height:45vh;max-height:430px;overflow:hidden;position:relative;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.85);}
.banner h1{
  position:absolute;bottom:70px;left:20px;color:#fff;
  font-family:'Playfair Display',serif;font-size:28px;
  text-shadow:0 3px 8px rgba(0,0,0,.6);
}
.search-area{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:90%;display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border-radius:50px;padding:6px 14px;
}
.search-area input{
  flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:14px;
}
.search-area input::placeholder{color:#ccc;}
.search-area button{
  background:var(--accent);border:none;border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;box-shadow:var(--shadow);
  font-size:20px;position:relative;
}
#cart-count{
  position:absolute;top:-4px;right:-4px;background:#dc2626;
  color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;
}
.categorias{
  display:flex;overflow-x:auto;padding:12px;gap:10px;
  scrollbar-width:none;user-select:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:#1e293b;border:1px solid var(--accent);
  color:var(--accent2);padding:10px 16px;border-radius:25px;
  cursor:pointer;font-weight:600;transition:.3s;white-space:nowrap;
}
.categorias button.active,.categorias button:hover{
  background:var(--accent);color:#000;transform:scale(1.05);
}
.container{padding:12px 15px;max-width:960px;margin:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.card{
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.06);transition:.25s;
}
.card:hover{transform:scale(1.03);border-color:var(--accent2);}
.card img{width:100%;height:130px;object-fit:cover;}
.card-body{padding:10px 12px;}
.card-body h3{
  font-size:15px;color:var(--accent2);
  font-family:'Playfair Display',serif;margin-bottom:4px;
}
.card-body p{color:var(--muted);font-size:13px;min-height:36px;}
.card-body span{display:block;margin-top:5px;color:var(--accent);font-weight:600;}
.card-body button{
  width:100%;background:var(--accent);color:#000;border:none;
  padding:8px;margin-top:8px;border-radius:var(--radius);
  font-weight:600;cursor:pointer;transition:.2s;
}
.card-body button:hover{background:var(--accent2);}
.popup{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;padding:20px;animation:fadeIn .3s;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.popup-content{
  background:#151d2f;border-radius:var(--radius);
  max-width:400px;width:100%;overflow:hidden;
  box-shadow:var(--shadow);position:relative;
}
.popup-content img{width:100%;height:180px;object-fit:cover;}
.popup-body{padding:15px;}
.popup-body h2{margin:0;font-family:'Playfair Display',serif;color:var(--accent2);}
.popup-body p{color:var(--muted);margin:8px 0;font-size:14px;}
.popup-body input,textarea,select{
  width:100%;margin-top:6px;padding:10px;background:#1e293b;

.popup-body label{font-weight:600;font-size:13px;color:var(--accent2);}
.popup-body button{

.popup-body button:hover{background:var(--accent2);}
.close-btn{

  border:none;color:var(--accent2);font-size:22px;cursor:pointer;

.popup-body .sug-card span{

.popup-body .sug-card button:hover{background:var(--accent2);}
.overlay{

.overlay img{width:90px;margin-bottom:20px;}

.sugestoes-content h2 {

  margin-bottom: 15px;

.sugestoes-item {
  background: rgba(255,255,255,0.05);

  padding: 10px;
  margin-bottom: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,.3);
  transition: .3s;

.sugestoes-item:hover {

.sugestoes-item img {

.sugestoes-item button:hover {

.close-popup {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: var(--accent2);
  font-size: 22px;
  cursor: pointer;

/* 🚫 Bloquear fundo ao abrir pop-up */
body.popup-ativo {
  overflow: hidden;
  touch-action: none;
}


  
</style>

// 🧠 VARIÁVEIS
let carrinho=[];
const categorias=[...new Set(produtos.map(p=>p.categoria))];
const catDiv=document.getElementById("categorias"),menuDiv=document.getElementById("menu");

// 🔹 GERA CATEGORIAS
categorias.forEach((c,i)=>{
 const b=document.createElement("button");
 b.textContent=c;if(i===0)b.classList.add("active");
 b.onclick=()=>filtrar(c);catDiv.appendChild(b);
});
filtrar(categorias[0]);

// 🧭 Controle da rolagem automática das categorias
let isDragging = false;
let isAutoScrolling = true;
let startX = 0;
let scrollStart = 0;
let scrollOffset = 0;

// 🖐️ Gestos manuais
catDiv.addEventListener("touchstart", e => {
  isDragging = true;
  isAutoScrolling = false; // 🔴 Para a rolagem automática ao tocar
  startX = e.touches[0].pageX;
  scrollStart = catDiv.scrollLeft;
  catDiv.style.scrollBehavior = "auto";
}, { passive: true });

catDiv.addEventListener("touchmove", e => {
  if (!isDragging) return;
  const walk = e.touches[0].pageX - startX;
  catDiv.scrollLeft = scrollStart - walk;
}, { passive: true });

catDiv.addEventListener("touchend", () => {
  isDragging = false;
}, { passive: true });

// 🕹️ Clique em categoria também pausa a rolagem
function filtrar(cat) {
  isAutoScrolling = false; // 🔴 Parar ao clicar
  document.querySelectorAll('.categorias button').forEach(b => b.classList.remove('active'));
  [...catDiv.children].find(b => b.textContent === cat).classList.add('active');
  renderizar(produtos.filter(p => p.categoria === cat));
}

// 🐢 Rolagem automática lenta e suave
setInterval(() => {
  if (!isAutoScrolling || isDragging) return;
  scrollOffset += 1; // velocidade de deslocamento
  catDiv.scrollTo({ left: scrollOffset, behavior: "smooth" });
  if (catDiv.scrollLeft + catDiv.clientWidth >= catDiv.scrollWidth - 5) {
    scrollOffset = 0;
    catDiv.scrollTo({ left: 0, behavior: "smooth" });
  }
}, 120);


// 🔹 FILTROS
function filtrar(cat){
 document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
 [...catDiv.children].find(b=>b.textContent===cat).classList.add('active');
 renderizar(produtos.filter(p=>p.categoria===cat));
}
function buscarItem(){
 const termo=document.getElementById("busca").value.toLowerCase();
 if(!termo)return filtrar(document.querySelector(".categorias button.active").textContent);
 renderizar(produtos.filter(p=>p.nome.toLowerCase().includes(termo)||p.desc.toLowerCase().includes(termo)));
}

// 🔹 RENDERIZAÇÃO
function renderizar(lista){
 menuDiv.innerHTML='';
 lista.forEach(p=>{
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`
  <img src="${p.img}">
  <div class="card-body">
    <h3>${p.nome}</h3>
    <p>${p.desc}</p>
    <span>R$ ${p.preco.toFixed(2)}</span>
    <button onclick="abrirPopup(${p.id})">Adicionar</button>
  </div>`;
  menuDiv.appendChild(c);
 });
}

// 🔹 POPUP ITEM
function abrirPopup(id){
 const p=produtos.find(x=>x.id===id);
 const div=document.createElement("div");
 div.classList.add("popup");
 div.innerHTML=`
 <div class="popup-content">
  <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
  <img src="${p.img}">
  <div class="popup-body">
    <h2>${p.nome}</h2><p>${p.desc}</p>
    <label>Quantidade</label><input id="qtd" type="number" min="1" value="1">
    <label>Observação</label><textarea id="obs" placeholder="Ex: sem cebola..."></textarea>
    <button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button>
  </div>
 </div>`;
 document.body.appendChild(div);
}

// 🔹 ADICIONAR AO CARRINHO
function adicionar(id){
 const qtd=parseInt(document.getElementById('qtd').value)||1;
 const obs=document.getElementById('obs').value||'';
 const p=produtos.find(x=>x.id===id);
 carrinho.push({...p,qtd,obs});
 document.querySelector('.popup')?.remove();
 atualizarCarrinho();
 mostrarSugestoes(p.id);
}

// 💡 Sugestões por ID do item (inteligente)
function mostrarSugestoes(idProduto) {
  const produtoBase = produtos.find(p => p.id === idProduto);
  if (!produtoBase) return;

  // busca IDs relacionados
  const idsRelacionados = relacoesPorId[idProduto] || [];

  // encontra produtos correspondentes
  let candidatos = produtos.filter(p => idsRelacionados.includes(p.id));

  // remove itens que já estão no carrinho
  const idsCarrinho = carrinho.map(i => i.id);
  candidatos = candidatos.filter(c => !idsCarrinho.includes(c.id));

  // fallback: se não tiver sugestões, pega 3 produtos aleatórios que não estejam no carrinho
  if (candidatos.length === 0) {
    candidatos = produtos.filter(p => !idsCarrinho.includes(p.id) && p.id !== idProduto).slice(0, 3);
  }

  // se mesmo assim não houver, sai
  if (candidatos.length === 0) return;

  const div = document.createElement("div");
  div.classList.add("popup");
  div.innerHTML = `
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>🍷 Sugestões que combinam com ${produtoBase.nome}</h2>
      ${candidatos.map(s => `
      <div class="sug-card">
        <img src="${s.img}" alt="${s.nome}">
        <strong>${s.nome}</strong>
        <small>${s.desc}</small>
        <span>R$ ${s.preco.toFixed(2)}</span>
        <button onclick="abrirPopup(${s.id}); this.closest('.popup').remove();">Pedir junto</button>
      </div>`).join('')}
      <button onclick="abrirCarrinho()">🛒 Ver Carrinho</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}


function abrirSugestao(id, btn){
  // Fecha o pop-up de sugestões antes de abrir o novo
  btn.closest('.sugestoes-popup')?.remove();
  // Reaproveita a mesma função que abre o pop-up de adicionar item
  abrirPopup(id);
}


function pedirJunto(id,btn){btn.closest('.popup').remove();abrirPopup(id);}
function atualizarCarrinho(){document.getElementById('cart-count').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);}

// 🔹 CARRINHO
function abrirCarrinho(){
 if(!carrinho.length)return alert("Carrinho vazio!");
 const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
 const div=document.createElement("div");
 div.classList.add("popup");
 div.innerHTML=`
 <div class="popup-content">
  <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
  <div class="popup-body">
    <h2>Seu pedido</h2>
    ${carrinho.map((i,ix)=>`
      <div class="sug-card">
        <img src="${i.img}">
        <div><strong>${i.nome}</strong><small>${i.qtd}x ${i.obs||''}</small><span>R$ ${(i.qtd*i.preco).toFixed(2)}</span></div>
        <button onclick="removerItem(${ix});this.closest('.popup').remove()">❌</button>
      </div>`).join('')}
    <h3>Total: R$ ${total.toFixed(2)}</h3>
    <button onclick="finalizarPedido()">Finalizar Pedido</button>
  </div>
 </div>`;
 document.body.appendChild(div);
}
function removerItem(ix){carrinho.splice(ix,1);atualizarCarrinho();abrirCarrinho();}

// 🔹 FINALIZAR PEDIDO
function finalizarPedido(){
 document.querySelectorAll('.popup').forEach(p=>p.remove());
 const c=JSON.parse(localStorage.getItem('cliente')||'{}');
 const div=document.createElement("div");
 div.classList.add("popup");
 div.innerHTML=`
 <div class="popup-content">
  <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
  <div class="popup-body">
    <h2>📦 Dados de Entrega</h2>
    <label>Nome</label><input id="nome" value="${c.nome||''}">
    <label>Email</label><input id="email" value="${c.email||''}">
    <label>WhatsApp</label><input id="whats" value="${c.whats||''}">
    <label>CEP</label><input id="cep" value="${c.cep||''}" onblur="buscarEndereco()">
    <label>Endereço</label><input id="endereco" value="${c.endereco||''}">
    <label>Bairro</label><input id="bairro" value="${c.bairro||''}" onblur="mostrarResumo()">
    <label>Número</label><input id="numero" value="${c.numero||''}">
    <label>Complemento</label><input id="complemento" value="${c.complemento||''}">
    <label>Forma de pagamento</label>
    <select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
    <label id="lTroco" style="display:none;">Troco para:</label>
    <input id="troco" style="display:none;" placeholder="Ex: R$ 100,00">
    <div id="resumo-total"></div>
    <button onclick="enviarPedido()">Enviar Pedido</button>
  </div>
 </div>`;
 document.body.appendChild(div);
 document.getElementById('pagamento').onchange=()=>{
   const v=document.getElementById('pagamento').value;
   document.getElementById('lTroco').style.display=v==='Dinheiro'?'block':'none';
   document.getElementById('troco').style.display=v==='Dinheiro'?'block':'none';
 };
}

// 🔹 CEP
async function buscarEndereco(){
 const cep=document.getElementById('cep').value.replace(/\D/g,'');
 if(cep.length!==8)return;
 const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
 const d=await r.json();
 if(!d.erro){endereco.value=d.logradouro||'';bairro.value=d.bairro||'';}
}

// 🔹 RESUMO + TAXA
function mostrarResumo(){
 const bairro=document.getElementById('bairro').value.trim();
 const resumoDiv=document.getElementById('resumo-total');
 const botaoEnviar=document.querySelector("#resumo-total + button");
 resumoDiv.innerHTML='';
 if(!bairro){botaoEnviar.disabled=true;botaoEnviar.style.opacity=".5";return;}
 if(!(bairro in taxas)){
   resumoDiv.innerHTML=`
   <div style="background:#3f1d1d;padding:10px;border-radius:10px;color:#fca5a5;">
     🚫 Não entregamos neste bairro.<br>Entre em contato pelo WhatsApp para verificar disponibilidade.
   </div>
   <a href="https://wa.me/557736135148?text=Olá! Gostaria de saber se fazem entregas no bairro ${bairro}." target="_blank"
   style="display:inline-block;margin-top:10px;background:#25D366;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;">💬 Falar no WhatsApp</a>`;
   botaoEnviar.disabled=true;botaoEnviar.style.opacity=".5";return;
 }
 const taxa=taxas[bairro];
 const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
 const total=subtotal+taxa;
 resumoDiv.innerHTML=`<strong>Resumo:</strong><br>Subtotal: R$ ${subtotal.toFixed(2)}<br>Entrega (${bairro}): R$ ${taxa.toFixed(2)}<br><strong>Total: R$ ${total.toFixed(2)}</strong>`;
 botaoEnviar.disabled=false;botaoEnviar.style.opacity="1";
}

// 🔹 ENVIAR PEDIDO
async function enviarPedido(){
 const bairro=document.getElementById('bairro').value.trim();
 if(!(bairro in taxas)){
   alert("⚠️ Este bairro ainda não possui entrega. Contate-nos via WhatsApp.");
   window.open(`https://wa.me/557736135148?text=Olá! Gostaria de saber se fazem entregas no bairro ${bairro}.`);
   return;
 }
 const c={nome:nome.value,email:email.value,whats:whats.value,cep:cep.value,endereco:endereco.value,bairro,numero:numero.value,complemento:complemento.value,pagamento:pagamento.value,troco:troco.value};
 localStorage.setItem("cliente",JSON.stringify(c));
 const taxa=taxas[bairro];
 const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
 const total=subtotal+taxa;
 const payload={acao:"pedido",cliente:c,itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),obs:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),subtotal,taxa,total};
 overlay.style.display='flex';
 try{
   await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
   alert(`✅ Pedido enviado!\nTotal: R$ ${total.toFixed(2)}`);
 }catch(e){alert("⚠️ Erro ao enviar pedido.");}
 overlay.style.display='none';
 carrinho=[];atualizarCarrinho();
}

// 🔒 Impede interação no fundo quando há pop-up
function bloquearFundo(){
  document.body.classList.add('popup-ativo');
}
function liberarFundo(){
  document.body.classList.remove('popup-ativo');
}

// Garante que qualquer pop-up ativa o bloqueio
const observer = new MutationObserver(()=>{
  const temPopup = document.querySelector('.popup, .sugestoes-popup');
  if(temPopup) bloquearFundo(); else liberarFundo();
});
observer.observe(document.body,{childList:true});

</script>
