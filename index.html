}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
header{

  color:var(--accent2);text-align:center;

}
.banner{width:100%;height:45vh;max-height:430px;overflow:hidden;position:relative;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.85);}
.banner h1{

.search-area{

}
.search-area input{
  flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:14px;
}
.search-area input::placeholder{color:#ccc;}
.search-area button{
  background:var(--accent);border:none;border-radius:50%;

  justify-content:center;cursor:pointer;box-shadow:var(--shadow);
  font-size:20px;position:relative;
}
#cart-count{
  position:absolute;top:-4px;right:-4px;background:#dc2626;
  color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;
}
.categorias{
  display:flex;overflow-x:auto;padding:12px;gap:10px;

}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:#1e293b;border:1px solid var(--accent);
  color:var(--accent2);padding:10px 16px;border-radius:25px;
  cursor:pointer;font-weight:600;transition:.3s;white-space:nowrap;
}
.categorias button.active,.categorias button:hover{
  background:var(--accent);color:#000;transform:scale(1.05);
}
.container {
  width: 100vw;        /* ocupa toda a largura visível */
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: hidden;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr); /* 5 colunas fixas */
  gap: 14px;
  width: 100%;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}


/* Cards proporcionais — mais largos, menos altos */
.card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,.06);
  transition: .25s;
}

.card img {
  width: 100%;
  height: 100px; /* altura controlada, deixa o card mais horizontal */
  object-fit: cover;
}

/* 🧱 Ajuste de responsividade total */
@media (max-width: 1400px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 992px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

/* 📱 Em celular — sempre 2 cards por linha */
@media (max-width: 768px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 10px;
  }

  .card img {
    height: 90px;
  }

  .card video, .card img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border: none;
}

/* Carrossel dentro do pop-up */
.media-carousel {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.media-carousel::-webkit-scrollbar { display: none; }

.media-carousel img, .media-carousel video {
  width: 100%;
  height: 180px;
  border-radius: 10px;
  object-fit: cover;
  scroll-snap-align: start;
}

  }

  }
}

/* 📲 Para telas muito pequenas (ex: iPhone SE) */
@media (max-width: 480px) {
  .grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;

}

function renderizar(lista) {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  if (!lista || lista.length === 0) {
    menu.innerHTML = `<p style="text-align:center;color:#ccc;padding:20px;">Nenhum item encontrado.</p>`;
    return;
  }

  lista.forEach(p => {
    const card = document.createElement("div");
    card.classList.add("card");

    const midia = p.video
      ? `<video src="${p.video}" autoplay muted loop playsinline></video>`
      : `<img src="${p.img}" alt="${p.nome}">`;

    card.innerHTML = `
  <div class="card-media">
    ${midia}
  </div>
  <div class="card-body">
    <h3>${p.nome}</h3>
    <p>${p.desc}</p>
    <span>R$ ${p.preco.toFixed(2)}</span>
    <button onclick="abrirPopup(${p.id})">Adicionar</button>
  </div>
`;


    menu.appendChild(card);
  });
}

// 🧭 Controle da rolagem automática das categorias
let isDragging = false;
let isAutoScrolling = true;
let startX = 0;
let scrollStart = 0;
let scrollOffset = 0;

// 🖐️ Gestos manuais (toque ou mouse)
function startScroll(x) {
  isDragging = true;
  isAutoScrolling = false; // 🔴 Para a rolagem automática
  startX = x;
  scrollStart = catDiv.scrollLeft;
  catDiv.style.scrollBehavior = "auto";
}
function moveScroll(x) {
  if (!isDragging) return;
  const walk = x - startX;
  catDiv.scrollLeft = scrollStart - walk;
}
function endScroll() { isDragging = false; }

// 🖱️ Suporte total para computador
catDiv.addEventListener("mousedown", e => startScroll(e.pageX));
catDiv.addEventListener("mousemove", e => moveScroll(e.pageX));
catDiv.addEventListener("mouseup", endScroll);
catDiv.addEventListener("mouseleave", endScroll);

// 📱 Suporte para toque (celular)
catDiv.addEventListener("touchstart", e => startScroll(e.touches[0].pageX), { passive: true });
catDiv.addEventListener("touchmove", e => moveScroll(e.touches[0].pageX), { passive: true });
catDiv.addEventListener("touchend", endScroll, { passive: true });

// 🧭 Scroll com roda do mouse também pausa o automático
catDiv.addEventListener("wheel", () => { isAutoScrolling = false; }, { passive: true });

// 🕹️ Clique em categoria também pausa a rolagem
function filtrar(cat) {
  isAutoScrolling = false; // 🔴 Parar ao clicar
  document.querySelectorAll('.categorias button').forEach(b => b.classList.remove('active'));
  [...catDiv.children].find(b => b.textContent === cat).classList.add('active');
  renderizar(produtos.filter(p => p.categoria === cat));
}

// 🐢 Rolagem automática lenta e suave (para desktop e mobile)
setInterval(() => {
  if (!isAutoScrolling || isDragging) return;
  scrollOffset += 1; // velocidade de deslocamento
  catDiv.scrollTo({ left: scrollOffset, behavior: "smooth" });
  if (catDiv.scrollLeft + catDiv.clientWidth >= catDiv.scrollWidth - 5) {
    scrollOffset = 0;
    catDiv.scrollTo({ left: 0, behavior: "smooth" });
  }
}, 120);

// 🔹 POPUP DE PRODUTO — compatível com imagem e vídeo
function abrirPopup(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;

  const div = document.createElement("div");
  div.classList.add("popup");

  // 🧠 Decide se mostra vídeo ou imagem
  const midiaHTML = p.video
    ? `<video autoplay muted loop playsinline style="width:100%;height:180px;object-fit:cover;border:none;">
         <source src="${p.video}" type="video/mp4">
       </video>`
    : `<img src="${p.img}" alt="${p.nome}" style="width:100%;height:180px;object-fit:cover;">`;

  div.innerHTML = `
    <div class="popup-content">
      <button class="close-btn" onclick="fecharPopup(this)">✖</button>
      ${midiaHTML}
      <div class="popup-body">
        <h2>${p.nome}</h2>
        <p>${p.desc}</p>
        <label>Quantidade</label>
        <input id="qtd" type="number" min="1" value="1">
        <label>Observação</label>
        <textarea id="obs" placeholder="Ex: sem cebola..."></textarea>
        <button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button>
      </div>
    </div>
  `;

  document.body.appendChild(div);
  document.body.classList.add('popup-ativo'); // bloqueia fundo
}

function fecharPopup(btn) {
  const popup = btn.closest('.popup');
  if (popup) popup.remove();
  if (!document.querySelector('.popup')) {
    document.body.classList.remove('popup-ativo');
  }
}


// 🔹 ADICIONAR AO CARRINHO
function adicionar(id){
 const qtd=parseInt(document.getElementById('qtd').value)||1;
 const obs=document.getElementById('obs').value||'';
 const p=produtos.find(x=>x.id===id);
 carrinho.push({...p,qtd,obs});
salvarCarrinhoLocal(carrinho);
 document.querySelector('.popup')?.remove();
 atualizarCarrinho();
 mostrarSugestoes(p.id);
}

function mostrarSugestoes(idProduto) {
  const produtoBase = produtos.find(p => p.id === idProduto);
  if (!produtoBase) return;

  const idsRelacionados = relacoesPorId[idProduto] || [];
  let candidatos = produtos.filter(p => idsRelacionados.includes(p.id));

  const idsCarrinho = carrinho.map(i => i.id);
  candidatos = candidatos.filter(c => !idsCarrinho.includes(c.id));

  if (candidatos.length === 0) {
    candidatos = produtos.filter(p => !idsCarrinho.includes(p.id) && p.id !== idProduto).slice(0, 3);
  }

  if (candidatos.length === 0) return;

  const div = document.createElement("div");
  div.classList.add("popup");
  div.innerHTML = `
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>🍷 Sugestões que combinam com ${produtoBase.nome}</h2>
      ${candidatos.map(s => `
        <div class="sug-card-horizontal">
          <div class="sug-topo">
            <img src="${s.img}" alt="${s.nome}">
            <div class="sug-info">
              <strong>${s.nome}</strong>
              <small>${s.desc}</small>
              <span>R$ ${s.preco.toFixed(2)}</span>
            </div>
          </div>
          <button onclick="abrirPopup(${s.id}); this.closest('.popup').remove();">Pedir junto</button>
        </div>
      `).join('')}
      <button onclick="abrirCarrinho()">🛒 Ver Carrinho</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

      <button onclick="fazerLogin()">Entrar</button>
      <hr style="margin:15px 0;border-color:#333;">
      <h3 style="color:var(--accent2);">Primeiro acesso?</h3>
      <button onclick="abrirCadastroRapido()">Criar Conta</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

// 🧾 Cadastro rápido
function abrirCadastroRapido() {
  document.querySelector(".popup")?.remove();
  const div = document.createElement("div");
  div.classList.add("popup");
  div.innerHTML = `
  <div class="popup-content">
    <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
    <div class="popup-body">
      <h2>📋 Criar Conta</h2>
      <input id="nome" placeholder="Nome completo">
      <input id="email" type="email" placeholder="Email">
      <input id="senha" type="password" placeholder="Senha">
      <input id="whats" placeholder="WhatsApp">
      <input id="cep" placeholder="CEP" onblur="buscarEndereco()">
      <input id="endereco" placeholder="Endereço">
      <input id="bairro" placeholder="Bairro">
      <input id="numero" placeholder="Número">
      <input id="complemento" placeholder="Complemento">
      <button onclick="registrarUsuario()">Salvar e Continuar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

// 🔐 Login existente
async function fazerLogin() {
  const email = document.getElementById("loginEmail").value;
  const senha = document.getElementById("loginSenha").value;

  const res = await fetch(`${ENDPOINT}?acao=loginUsuario&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`);
  const data = await res.json();

  if (data.sucesso) {
    localStorage.setItem("mercatto_cliente", JSON.stringify(data.usuario));
    alert("✅ Login realizado!");
    document.querySelector(".popup")?.remove();
    window.location.href = "index.html"; // 🔹 volta pro cardápio
  } else {
    alert("❌ Email ou senha incorretos.");
  }
}

// 🧾 Registrar novo usuário
async function registrarUsuario() {
  const d = {
    acao: "registrarUsuario",
    nome: nome.value,
    email: email.value,
    senha: senha.value,
    whats: whats.value,
    cep: cep.value,
    endereco: endereco.value,
    bairro: bairro.value,
    numero: numero.value,
    complemento: complemento.value
  };

  const r = await fetch(ENDPOINT, { method: "POST", body: JSON.stringify(d) });
  const txt = await r.text();

  if (txt.toLowerCase().includes("sucesso")) {
    localStorage.setItem("mercatto_cliente", JSON.stringify(d));
    alert("✅ Cadastro realizado com sucesso!");
    document.querySelector(".popup")?.remove();
    window.location.href = "index.html"; // 🔹 redireciona ao cardápio
  } else {
    alert("⚠️ Erro ao cadastrar: " + txt);
  }
}

// 🚪 Sair da conta
function sair() {
  localStorage.removeItem("mercatto_cliente");
  alert("Você saiu da conta.");
  document.querySelector(".popup")?.remove();
  abrirCadastroLogin();
}
