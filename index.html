<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--text:#f8fafc;

}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
header{
  background:linear-gradient(90deg,#000,#1c1306);
  color:var(--accent2);text-align:center;
  padding:15px;font-family:'Playfair Display',serif;
  font-size:22px;letter-spacing:.5px;box-shadow:var(--shadow);
}
.banner{
  width:100%;height:45vh;max-height:430px;overflow:hidden;position:relative;
}
.banner img{
  width:100%;height:100%;object-fit:cover;filter:brightness(.85);
}
.banner h1{
  position:absolute;bottom:25px;left:20px;color:#fff;
  font-family:'Playfair Display',serif;font-size:30px;
  text-shadow:0 3px 8px rgba(0,0,0,.6);
}
.categorias{
  display:flex;overflow-x:auto;scroll-behavior:smooth;
  padding:12px;gap:10px;scrollbar-width:none;user-select:none;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:#1e293b;border:1px solid var(--accent);
  color:var(--accent2);padding:10px 16px;border-radius:25px;
  cursor:pointer;font-weight:600;transition:.3s;white-space:nowrap;
}
.categorias button.active,.categorias button:hover{
  background:var(--accent);color:#000;transform:scale(1.05);
}
.container{padding:12px 15px;max-width:960px;margin:auto;}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}
.card{
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.06);
  transition:.25s;
}
.card:hover{transform:scale(1.03);border-color:var(--accent2);}
.card img{width:100%;height:130px;object-fit:cover;}
.card-body{padding:10px 12px;}
.card-body h3{
  font-size:15px;color:var(--accent2);
  font-family:'Playfair Display',serif;margin-bottom:4px;
}
.card-body p{color:var(--muted);font-size:13px;min-height:36px;}
.card-body span{display:block;margin-top:5px;color:var(--accent);font-weight:600;}
.card-body button{
  width:100%;background:var(--accent);color:#000;border:none;
  padding:8px;margin-top:8px;border-radius:var(--radius);
  font-weight:600;cursor:pointer;transition:.2s;
}
.card-body button:hover{background:var(--accent2);}
#cart-btn{
  position:fixed;bottom:20px;right:20px;width:65px;height:65px;
  border-radius:50%;border:none;background:var(--accent);
  box-shadow:var(--shadow);font-size:26px;cursor:pointer;z-index:10;
}
#cart-count{
  position:absolute;top:5px;right:5px;background:#dc2626;
  color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;
}
.popup{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;padding:20px;animation:fadeIn .3s;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.popup-content{
  background:#151d2f;border-radius:var(--radius);
  max-width:400px;width:100%;overflow:hidden;
  box-shadow:var(--shadow);
}
.popup-content img{width:100%;height:180px;object-fit:cover;}
.popup-body{padding:15px;}
.popup-body h2{
  margin:0;font-family:'Playfair Display',serif;color:var(--accent2);
}
.popup-body p{color:var(--muted);margin:8px 0;font-size:14px;}
.popup-body input,textarea,select{
  width:100%;margin-top:6px;padding:10px;background:#1e293b;
  border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;
}
.popup-body label{font-weight:600;font-size:13px;color:var(--accent2);}
.popup-body button{
  width:100%;padding:12px;margin-top:14px;border:none;border-radius:var(--radius);
  background:var(--accent);font-weight:600;cursor:pointer;
}
.popup-body button:hover{background:var(--accent2);}
.close-btn{
  position:absolute;top:20px;right:20px;background:none;
  border:none;color:var(--accent2);font-size:22px;cursor:pointer;

.sug-card{
  display:flex;align-items:center;gap:10px;background:#1e293b;
  padding:10px;border-radius:14px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:.3s;cursor:pointer;

.sug-card:hover{transform:scale(1.02);background:#2b3a50;}
.sug-card img{

.sug-card strong{color:var(--accent2);}
.sug-card small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
.sug-card span{color:var(--accent);font-weight:600;font-size:13px;margin-top:3px;display:block;}
.overlay{
  display:none;align-items:center;justify-content:center;flex-direction:column;
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;

.overlay img{width:90px;margin-bottom:20px;}
</style>

  {id: 86, nome: 'Calzone Carne Seca & Queijo Coalho', desc: 'Carne seca desfiada e temperada com queijo coalho grelhado, muçarela e orégano fresco.', preco: 88.40, img: 'img/padrao.jpg', categoria: 'Calzone Especiais'},
  {id: 87, nome: 'Calzone Champignon Trufado', desc: 'Molho de tomate artesanal, champignon salteado na manteiga trufada, muçarela derretida e tomates secos.', preco: 82.90, img: 'img/padrao.jpg', categoria: 'Calzone Especiais'},
  {id: 88, nome: 'Calzone Frango Cremoso', desc: 'Massa artesanal assada com frango desfiado, muçarela cremosa e Catupiry Original.', preco: 69.90, img: 'img/padrao.jpg', categoria: 'Calzone Especiais'},

  // 🍰 SOBREMESAS INDIVIDUAIS MARAVILHOSAS
  {id: 89, nome: 'Abacaxi em Rodelas', desc: 'Fatias de abacaxi suculento com leve calda cítrica, refrescante e aromática.', preco: 23.50, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'},
  {id: 90, nome: 'Pudim Golden', desc: 'Pudim dourado e cremoso, de sabor suave e textura aveludada que derrete na boca.', preco: 34.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'},
  {id: 91, nome: 'Cheesecake de Goiaba com Queijo', desc: 'Base de biscoito, creme de queijo e cobertura de goiabada, equilibrando o doce e o suave.', preco: 39.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'}
];


let carrinho = [];

// montar categorias
const categorias = [...new Set(produtos.map(p=>p.categoria))];
const catDiv = document.getElementById('categorias');
const menuDiv = document.getElementById('menu');

categorias.forEach((c,i)=>{
  const b=document.createElement('button');
  b.textContent=c;
  if(i===0)b.classList.add('active');
  b.onclick=()=>filtrar(c);
  catDiv.appendChild(b);
});
filtrar(categorias[0]);
// 🚀 Rolagem automática rápida + toque instantâneo e fluido
let dir = 1;
let autoScroll;
let scrollVel = 1.8; // velocidade do auto-scroll (↑ aumenta a rolagem automática)

function iniciarAutoScroll() {
  pararAutoScroll();
  autoScroll = requestAnimationFrame(scrollAuto);
}
function pararAutoScroll() {
  cancelAnimationFrame(autoScroll);
}
function scrollAuto() {
  catDiv.scrollLeft += dir * scrollVel;
  if (catDiv.scrollLeft + catDiv.clientWidth >= catDiv.scrollWidth || catDiv.scrollLeft <= 0) dir *= -1;
  autoScroll = requestAnimationFrame(scrollAuto);
}
iniciarAutoScroll();

// 🖐️ Toque super responsivo + inércia suave
let tocando = false;
let inicioX = 0;
let scrollIni = 0;
let vel = 0;
let ultX = 0;
let ultimoTempo = 0;

catDiv.addEventListener("touchstart", e => {
  pararAutoScroll();
  tocando = true;
  inicioX = e.touches[0].pageX;
  scrollIni = catDiv.scrollLeft;
  ultX = inicioX;
  ultimoTempo = performance.now();
  vel = 0;
});

catDiv.addEventListener("touchmove", e => {
  if (!tocando) return;
  const x = e.touches[0].pageX;
  const dx = x - inicioX;
  catDiv.scrollLeft = scrollIni - dx;
  const tempo = performance.now();
  const deltaT = tempo - ultimoTempo;
  vel = (x - ultX) / deltaT * 45; // ⚙️ sensibilidade do toque (↑ mais veloz e responsivo)
  ultX = x;
  ultimoTempo = tempo;
});

catDiv.addEventListener("touchend", () => {
  tocando = false;

  // ✨ Inércia natural e acelerada
  function momentum() {
    catDiv.scrollLeft -= vel;
    vel *= 0.94;
    if (Math.abs(vel) > 0.5) requestAnimationFrame(momentum);
    else iniciarAutoScroll();
  }
  requestAnimationFrame(momentum);
});







// filtrar
function filtrar(cat){
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...catDiv.children].find(b=>b.textContent===cat).classList.add('active');
  menuDiv.innerHTML='';
  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`
      <img src="${p.img}">
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <span>R$ ${p.preco.toFixed(2)}</span>
        <button onclick="abrirPopup(${p.id})">Adicionar</button>
      </div>`;
    menuDiv.appendChild(c);
  });
}

// popup item
function abrirPopup(id){
  const p=produtos.find(x=>x.id===id);
  const div=document.createElement('div');
  div.classList.add('popup');
  div.innerHTML=`
    <div class="popup-content">
      <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
      <img src="${p.img}">
      <div class="popup-body">
        <h2>${p.nome}</h2>
        <p>${p.desc}</p>
        <label>Quantidade</label><input id="qtd" type="number" min="1" value="1">
        <label>Observação</label><textarea id="obs" placeholder="Ex: sem cebola, bem passado..."></textarea>
        <button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}

// adicionar item e sugerir
function adicionar(id){
  const qtd=parseInt(document.getElementById('qtd').value)||1;
  const obs=document.getElementById('obs').value||'';
  const p=produtos.find(x=>x.id===id);
  carrinho.push({...p,qtd,obs});
  document.querySelector('.popup')?.remove();
  atualizarCarrinho();
  mostrarSugestoes(p.categoria);
}

function mostrarSugestoes(cat){
  const sugs=produtos.filter(p=>p.categoria!==cat).slice(0,3);
  const div=document.createElement('div');
  div.classList.add('popup');
  div.innerHTML=`
    <div class="popup-content">
      <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
      <div class="popup-body">
        <h2>🍽️ Sugestões que combinam</h2>
        ${sugs.map(s=>`
          <div class="sug-card" onclick="abrirPopup(${s.id});this.closest('.popup').remove()">
            <img src="${s.img}">
            <div>
              <strong>${s.nome}</strong>
              <small>${s.desc}</small>
              <span>R$ ${s.preco.toFixed(2)}</span>
            </div>
          </div>`).join('')}
        <button onclick="abrirCarrinho()">Ver Carrinho</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}

function atualizarCarrinho(){
  document.getElementById('cart-count').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
}

// carrinho
function abrirCarrinho(){
  if(!carrinho.length)return alert("Carrinho vazio!");
  const div=document.createElement('div');
  div.classList.add('popup');
  const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  div.innerHTML=`
    <div class="popup-content">
      <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
      <div class="popup-body">
        <h2>🛍️ Seu Carrinho</h2>
        ${carrinho.map((i,ix)=>`
          <div class="sug-card">
            <img src="${i.img}">
            <div><strong>${i.nome}</strong><small>${i.qtd}x ${i.obs||''}</small><span>R$ ${(i.qtd*i.preco).toFixed(2)}</span></div>
            <button onclick="removerItem(${ix});this.closest('.popup').remove()">❌</button>
          </div>`).join('')}
        <h3>Total: R$ ${total.toFixed(2)}</h3>
        <button onclick="finalizarPedido()">Finalizar Pedido</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}

function removerItem(ix){carrinho.splice(ix,1);atualizarCarrinho();abrirCarrinho();}

// finalizar
function finalizarPedido(){
  document.querySelectorAll('.popup').forEach(p=>p.remove());
  const cliente=JSON.parse(localStorage.getItem('cliente')||'{}');
  const div=document.createElement('div');
  div.classList.add('popup');
  div.innerHTML=`
    <div class="popup-content">
      <button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
      <div class="popup-body">
        <h2>📦 Dados de Entrega</h2>
        <label>Nome</label><input id="nome" value="${cliente.nome||''}">
        <label>Email</label><input id="email" value="${cliente.email||''}">
        <label>WhatsApp</label><input id="whats" value="${cliente.whats||''}">
        <label>CEP</label><input id="cep" value="${cliente.cep||''}" onblur="buscarEndereco()">
        <label>Endereço</label><input id="endereco" value="${cliente.endereco||''}">
        <label>Bairro</label><input id="bairro" value="${cliente.bairro||''}">
        <label>Número</label><input id="numero" value="${cliente.numero||''}">
        <label>Complemento</label><input id="complemento" value="${cliente.complemento||''}">
        <label>Forma de pagamento</label>
        <select id="pagamento">
          <option>Pix</option><option>Cartão</option><option>Dinheiro</option>
        </select>
        <label id="lTroco" style="display:none;">Troco para:</label>
        <input id="troco" style="display:none;" placeholder="Ex: R$ 100,00">
        <button onclick="enviarPedido()">Enviar Pedido</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('pagamento').onchange=()=>{
    const v=document.getElementById('pagamento').value;
    document.getElementById('lTroco').style.display=v==='Dinheiro'?'block':'none';
    document.getElementById('troco').style.display=v==='Dinheiro'?'block':'none';
  };
}

async function buscarEndereco(){
  const cep=document.getElementById('cep').value.replace(/\D/g,'');
  if(cep.length!==8)return;
  const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  const d=await r.json();
  if(!d.erro){
    endereco.value=d.logradouro||'';bairro.value=d.bairro||'';
  }
}

async function enviarPedido(){
  const c={nome:nome.value,email:email.value,whats:whats.value,cep:cep.value,endereco:endereco.value,bairro:bairro.value,numero:numero.value,complemento:complemento.value,pagamento:pagamento.value,troco:troco.value};
  localStorage.setItem("cliente",JSON.stringify(c));
  const taxa=c.bairro.includes("Centro")?5:8;
  const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0)+taxa;
  const payload={acao:"pedido",cliente:c,itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),obs:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),subtotal:carrinho.reduce((s,i)=>s+i.qtd*i.preco,0),taxa:taxa,total:total};
  overlay.style.display='flex';
  try{
    await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    alert("✅ Pedido enviado com sucesso!");
  }catch(e){alert("⚠️ Erro ao enviar pedido.");}
  overlay.style.display='none';carrinho=[];atualizarCarrinho();
}
</script>
