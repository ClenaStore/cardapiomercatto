<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🍽️ Mercatto Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/imask"></script>
<style>
:root{
  --bg:#f4f1ec;--card:#fffaf5;--accent:#b8860b;--ink:#3a2e1f;--muted:#6e6252;
  --radius:14px;--shadow:0 3px 8px rgba(0,0,0,0.08);
}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
}
header{
  background:var(--accent);
  color:#fff;
  text-align:center;
  padding:18px 10px;
  font-family:'Playfair Display',serif;
  font-size:22px;
  box-shadow:0 2px 5px rgba(0,0,0,0.15);
}
main{
  max-width:480px;
  margin:auto;
  padding:0 12px 100px;
}
.banner{
  width:100%;
  margin:18px auto;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  border:3px solid #e0d7c5;
}
.banner img{
  width:100%;
  height:160px;
  object-fit:cover;
  display:block;
}
.section{
  margin:24px 0;
}
.section h2{
  color:var(--accent);
  font-family:'Playfair Display',serif;
  margin-bottom:12px;
  font-size:20px;
  border-bottom:1px solid #d7ccbb;
  padding-bottom:4px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .2s;
  border:1px solid #e2d8c5;
}
.card:hover{transform:scale(1.02);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px 12px;}
.card-body h3{margin:0;font-size:15px;font-family:'Playfair Display',serif;}
.card-body p{font-size:13px;color:var(--muted);margin:4px 0;}
.card-body span{font-weight:600;color:var(--accent);}
button.add{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:8px;
  border-radius:var(--radius);
  width:100%;
  margin-top:8px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:.3px;
}
button.add:hover{opacity:.9;}
#cart-btn{
  position:fixed;
  bottom:20px;right:20px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:50%;
  width:60px;height:60px;
  box-shadow:var(--shadow);
  font-size:24px;
  cursor:pointer;
  z-index:50;
}
#cart-count{
  position:absolute;
  top:5px;right:5px;
  background:#a12f2f;
  color:#fff;
  font-size:12px;
  border-radius:50%;
  padding:2px 6px;
}
#cart-modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  display:none;justify-content:center;align-items:center;
  z-index:100;
}
.cart-content{
  background:#fffaf5;
  width:90%;max-width:440px;
  border-radius:var(--radius);
  padding:20px;
  max-height:90vh;overflow:auto;
  box-shadow:var(--shadow);
  border:2px solid #e0d7c5;
}
.cart-content h3{
  text-align:center;
  color:var(--accent);
  font-family:'Playfair Display',serif;
  margin-bottom:12px;
}
.item-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
  padding-bottom:6px;
  border-bottom:1px solid #e6dcc8;
}
.summary{margin-top:15px;border-top:2px solid #d7ccbb;padding-top:10px;}
.finalizar{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:10px;
  width:100%;
  border-radius:var(--radius);
  font-weight:600;
  margin-top:10px;
  letter-spacing:.3px;
}
input,select{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  border:1px solid #d7ccbb;
  border-radius:8px;
  font-size:15px;
  background:#fffefb;
}
label{font-size:13px;font-weight:600;color:var(--muted);}
#infoTotais{font-size:14px;margin-top:-4px;color:var(--muted);}
#infoTotais p strong{color:var(--accent);}
.nasc-row{display:flex;gap:8px;align-items:center;}
.nasc-row input, .nasc-row select{flex:1;}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  display:none;align-items:center;justify-content:center;z-index:9999;
  color:#fff;font-size:18px;flex-direction:column;text-align:center;
}
#overlay img{width:100px;margin-bottom:20px;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
</style>
</head>
<body>

<header>🍽️ Mercatto Delivery</header>

<main>
  <div class="banner">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" alt="Banner principal">
  </div>

  <!-- 🍔 Lanches -->
  <section class="section">
    <h2>🍔 Lanches</h2>
    <div class="grid" id="lanches"></div>
  </section>

  <!-- 🥤 Bebidas -->
  <section class="section">
    <h2>🥤 Bebidas</h2>
    <div class="grid" id="bebidas"></div>
  </section>

  <!-- 🍟 Acompanhamentos -->
  <section class="section">
    <h2>🍟 Acompanhamentos</h2>
    <div class="grid" id="acompanhamentos"></div>
  </section>
</main>

<!-- 🛒 Carrinho -->
<button id="cart-btn">🛒<span id="cart-count">0</span></button>
<div id="cart-modal">
  <div class="cart-content">
    <h3>🧾 Seu Pedido</h3>
    <div id="cart-items"></div>
    <div class="summary" id="formCliente" style="display:none;"></div>
  </div>
</div>

<!-- ⏳ Overlay -->
<div id="overlay">
  <img src="https://i.imgur.com/8Km9tLL.png" alt="logo">
  <p>Enviando seu pedido...<br>Por favor, aguarde 🕒</p>
</div>
