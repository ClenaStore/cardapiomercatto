:root{

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
header{background:linear-gradient(90deg,#000,#1c1306);color:var(--accent2);text-align:center;padding:15px;font-family:'Playfair Display',serif;font-size:22px;letter-spacing:.5px;box-shadow:var(--shadow);}
.banner{width:100%;height:45vh;max-height:430px;overflow:hidden;position:relative;}

.search-area{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:90%;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:50px;padding:6px 14px;}

.search-area input::placeholder{color:#ccc;}
.search-area button{background:var(--accent);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);font-size:20px;position:relative;}

.categorias::-webkit-scrollbar{display:none;}
.categorias button{flex-shrink:0;background:#1e293b;border:1px solid var(--accent);color:var(--accent2);padding:10px 16px;border-radius:25px;cursor:pointer;font-weight:600;transition:.3s;white-space:nowrap;}
.categorias button.active,.categorias button:hover{background:var(--accent);color:#000;transform:scale(1.05);}
.container{width:100vw;margin:0;padding:0;max-width:100%;overflow-x:hidden;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:100%;margin:0;padding:20px;box-sizing:border-box;}
@media (max-width:1400px){.grid{grid-template-columns:repeat(4,1fr);}}
@media (max-width:992px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:768px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:10px;}.card img{height:90px;}}
@media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:8px;}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.06);transition:.25s;display:flex;flex-direction:column;height:280px;}
.card:hover{transform:scale(1.03);border-color:var(--accent2);}
.card-media{width:100%;height:140px;background:#0e1623;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;border:none;}
.card-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:10px 12px;}
.card-body h3{font-size:15px;color:var(--accent2);font-family:'Playfair Display',serif;margin-bottom:4px;}
.card-body p{color:var(--muted);font-size:13px;min-height:36px;margin-bottom:4px;}
.card-body span{display:block;margin-top:5px;color:var(--accent);font-weight:600;}
.card-body button{width:100%;background:var(--accent);color:#000;border:none;padding:8px;margin-top:auto;border-radius:25px;font-weight:600;cursor:pointer;transition:.2s;}
.card-body button:hover{background:var(--accent2);}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.popup-content{background:#151d2f;border-radius:var(--radius);max-width:400px;width:100%;overflow:hidden;box-shadow:var(--shadow);position:relative;}
.popup-content img{width:100%;height:180px;object-fit:cover;}
.popup-body{padding:15px;}
.popup-body h2{margin:0;font-family:'Playfair Display',serif;color:var(--accent2);}

.popup-body button:hover{background:var(--accent2);}
.close-btn{position:absolute;top:15px;right:15px;background:none;border:none;color:var(--accent2);font-size:22px;cursor:pointer;}
.overlay{display:none;align-items:center;justify-content:center;flex-direction:column;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;}

.carrinho-footer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(21,29,47,0.95)0%,rgba(21,29,47,1)100%);padding:10px 15px;border-top:1px solid rgba(255,255,255,0.08);text-align:right;backdrop-filter:blur(6px);}

function filtrar(cat){document.querySelectorAll(".categorias button").forEach(b=>b.classList.remove("active"));[...catDiv.children].find(b=>b.textContent===cat).classList.add("active");renderizar(produtos.filter(p=>p.categoria===cat));}

function buscarItem(){const t=document.getElementById("busca").value.toLowerCase();if(!t)return filtrar(document.querySelector(".categorias button.active").textContent);renderizar(produtos.filter(p=>p.nome.toLowerCase().includes(t)||p.desc.toLowerCase().includes(t)));}

function renderizar(lista){

lista.forEach(p=>{
 const card=document.createElement("div");
 card.classList.add("card");
 card.innerHTML=`<div class="card-media"><img src="${p.img}"></div>
 <div class="card-body"><h3>${p.nome}</h3><p>${p.desc}</p><span>R$ ${p.preco.toFixed(2)}</span>
 <button onclick="abrirPopup(${p.id})">Adicionar</button></div>`;
 menu.appendChild(card);
});
}

// 🔹 Popup e carrinho
function abrirPopup(id){const p=produtos.find(x=>x.id===id);const div=document.createElement("div");div.classList.add("popup");
div.innerHTML=`<div class="popup-content"><button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
<div class="popup-body"><h2>${p.nome}</h2><p>${p.desc}</p><label>Quantidade</label><input id="qtd" type="number" min="1" value="1">
<label>Observação</label><textarea id="obs"></textarea><button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button></div></div>`;
document.body.appendChild(div);}
function adicionar(id){const qtd=parseInt(document.getElementById("qtd").value)||1;const obs=document.getElementById("obs").value||"";const p=produtos.find(x=>x.id===id);
carrinho.push({...p,qtd,obs});salvarCarrinhoLocal(carrinho);document.querySelector(".popup")?.remove();atualizarCarrinho();}
function atualizarCarrinho(){document.getElementById("cart-count").textContent=carrinho.reduce((s,i)=>s+i.qtd,0);}
function abrirCarrinho(){if(!carrinho.length)return alert("Carrinho vazio!");
const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
const div=document.createElement("div");div.classList.add("popup");
div.innerHTML=`<div class="popup-content"><button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
<div class="popup-body"><h2>🛒 Seu Pedido</h2>${carrinho.map((i,ix)=>`<div><strong>${i.nome}</strong> - ${i.qtd}x R$ ${(i.qtd*i.preco).toFixed(2)} <button onclick="removerItem(${ix})">❌</button></div>`).join("")}
<h3>Total: R$ ${total.toFixed(2)}</h3><button onclick="finalizarPedido()">Finalizar Pedido</button></div></div>`;
document.body.appendChild(div);}
function removerItem(ix){carrinho.splice(ix,1);salvarCarrinhoLocal(carrinho);document.querySelector(".popup")?.remove();abrirCarrinho();}

// 🔹 Finalizar pedido com pontos
async function finalizarPedido(){
const c=carregarClienteLocal();
if(!c.email)return alert("Faça login antes de pedir.");
const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
let total=subtotal;
const pontosUsar=parseInt(prompt("Usar quantos pontos? (100 pts = R$1,00)"))||0;
if(pontosUsar>0){
 const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"usarPontos",email:c.email,pontos:pontosUsar})});
 const d=await r.json();if(d.sucesso){total-=d.desconto;alert(`Desconto de R$${d.desconto.toFixed(2)} aplicado!`);}
 else alert(d.mensagem);
}
await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"pedido",cliente:c,itens:carrinho.map(i=>`${i.nome}x${i.qtd}`).join(", "),subtotal,total,pontosUsados:pontosUsar})});
const pontosGerados=Math.floor(total);
await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"adicionarPontos",email:c.email,pontos:pontosGerados})});
alert(`✅ Pedido enviado!\n💎 Você ganhou ${pontosGerados} pontos!`);
carrinho=[];salvarCarrinhoLocal(carrinho);atualizarCarrinho();
}

const div=document.createElement("div");div.classList.add("popup");
div.innerHTML=`<div class="popup-content"><button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
<div class="popup-body"><h2>${c.nome}</h2><p>${c.email}</p><p>💎 Pontos: <span id="saldoPontos">...</span></p><button onclick="sair()">Sair</button></div></div>`;
document.body.appendChild(div);carregarPontos(c.email);}
async function carregarPontos(email){const r=await fetch(\`\${ENDPOINT}?acao=getUsuario&email=\${email}\`);const d=await r.json();
document.getElementById("saldoPontos").textContent=d.usuario?.pontos||0;}
function sair(){localStorage.removeItem(STORAGE_KEYS.cliente);alert("Saiu da conta.");}
</script>
