:root{
  --bg:#f4f1ec;--card:#fffaf5;--accent:#b8860b;--ink:#3a2e1f;--muted:#6e6252;

}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);
  overflow-x:hidden;scroll-behavior:smooth;
}
header{
  background:var(--accent);color:#fff;text-align:center;
  padding:18px 10px;font-family:'Playfair Display',serif;font-size:22px;
  box-shadow:var(--shadow);
}
.banner{width:100%;max-width:600px;margin:15px auto;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.banner img{width:100%;display:block;}
.categorias{
  display:flex;overflow-x:auto;gap:10px;
  padding:10px;margin:0 auto 10px;scrollbar-width:none;max-width:600px;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:var(--card);border:1px solid #e0d7c5;
  color:var(--accent);padding:8px 16px;border-radius:20px;
  font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s;box-shadow:var(--shadow);
}
.categorias button.active{background:var(--accent);color:#fff;}
.container{padding:10px;margin:0 auto;max-width:600px;}
h2{margin-top:10px;color:var(--accent);font-family:'Playfair Display',serif;border-bottom:1px solid #d7ccbb;padding-bottom:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .2s;border:1px solid #e2d8c5;}
.card:hover{transform:scale(1.02);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;}
.card-body h3{margin:0;font-size:16px;font-family:'Playfair Display',serif;}
.card-body p{font-size:13px;color:var(--muted);margin:4px 0;}
.card-body span{font-weight:600;color:var(--accent);}
button.add{background:var(--accent);color:#fff;border:none;padding:8px;border-radius:var(--radius);width:100%;margin-top:8px;font-weight:600;cursor:pointer;}
button.add:hover{opacity:.85;}
#cart-btn{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:60px;height:60px;box-shadow:var(--shadow);font-size:24px;cursor:pointer;z-index:20;}
#cart-count{position:absolute;top:6px;right:6px;background:#a12f2f;color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;}
#cart-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;justify-content:center;align-items:center;z-index:999;}
.cart-content{background:#fffaf5;width:90%;max-width:430px;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:2px solid #e0d7c5;display:flex;flex-direction:column;align-items:stretch;max-height:90vh;overflow:hidden;}
.cart-body{flex:1;overflow-y:auto;padding-right:6px;}
.item-line{display:flex;justify-content:space-between;align-items:center;margin:6px 0;padding-bottom:6px;border-bottom:1px solid #e6dcc8;}
.finalizar{background:var(--accent);color:#fff;border:none;padding:10px;width:100%;border-radius:var(--radius);font-weight:600;margin-top:10px;}
input,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d7ccbb;border-radius:8px;font-size:15px;background:#fffefb;}
label{font-size:13px;font-weight:600;color:var(--muted);}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;color:#fff;font-size:18px;flex-direction:column;text-align:center;}
#overlay img{width:90px;margin-bottom:20px;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
</style>

  {id: 89, nome: 'Abacaxi em Rodelas', desc: 'Fatias de abacaxi suculento com leve calda cítrica, refrescante e aromática.', preco: 23.50, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'},
  {id: 90, nome: 'Pudim Golden', desc: 'Pudim dourado e cremoso, de sabor suave e textura aveludada que derrete na boca.', preco: 34.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'},
  {id: 91, nome: 'Cheesecake de Goiaba com Queijo', desc: 'Base de biscoito, creme de queijo e cobertura de goiabada, equilibrando o doce e o suave.', preco: 39.90, img: 'img/padrao.jpg', categoria: 'Sobremesas Individuais Maravilhosas'}
];


const categoriasUnicas=[...new Set(produtos.map(p=>p.categoria))];
const categoriasDiv=document.getElementById('categorias'),menuDiv=document.getElementById('menu');
categoriasUnicas.forEach((cat,i)=>{const b=document.createElement('button');b.textContent=cat;b.onclick=()=>filtrarCategoria(cat);if(i===0)b.classList.add('active');categoriasDiv.appendChild(b);});
filtrarCategoria(categoriasUnicas[0]);

function filtrarCategoria(cat){
  categoriaAtiva=cat;document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...categoriasDiv.children].find(b=>b.textContent===cat)?.classList.add('active');
  menuDiv.innerHTML='';
  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<img src="${p.img}"><div class="card-body"><h3>${p.nome}</h3><p>${p.desc}</p><span>R$${p.preco.toFixed(2)}</span><button class="add" onclick="abrirAdd(${p.id})">Adicionar</button></div>`;
    menuDiv.appendChild(c);
  });
}

function abrirAdd(id){
  const p=produtos.find(x=>x.id===id);
  const m=document.createElement('div');
  m.style.cssText=`position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10000;`;
  m.innerHTML=`<div style="background:#fffaf5;padding:25px;border-radius:12px;width:90%;max-width:320px;text-align:center;">
  <h3 style="color:#b8860b;">${p.nome}</h3>
  <p>${p.desc}</p>
  <label>Quantidade:</label><input id="qtdTemp" type="number" min="1" value="1" style="width:80px;">
  <label>Observação:</label><input id="obsTemp" placeholder="(opcional)" style="width:100%;margin-top:5px;">
  <button style="margin-top:12px;background:#b8860b;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;" onclick="confirmarAdd(${p.id})">Adicionar</button>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
}
function confirmarAdd(id){
  const qtd=parseInt(document.getElementById('qtdTemp').value)||1;
  const obs=document.getElementById('obsTemp').value||'';
  const p=produtos.find(x=>x.id===id);
  const existe=carrinho.find(i=>i.id===id&&i.obs===obs);
  if(existe){existe.qtd+=qtd;}else{carrinho.push({...p,qtd,obs});}
  document.querySelectorAll('div[style*="position:fixed"]').forEach(x=>x.remove());
  renderCarrinho();
}

function renderCarrinho(){
  const div=document.getElementById('cart-items');
  const btn=document.getElementById('btnFinalizar');
  div.innerHTML='';
  carrinho.forEach((i,idx)=>{
    div.innerHTML+=`<div class="item-line"><span>${i.nome} x${i.qtd}</span><span>R$${(i.preco*i.qtd).toFixed(2)}</span><button onclick="remover(${idx})">✖</button></div><small>Obs: ${i.obs||'-'}</small>`;
  });
  document.getElementById('cart-count').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
  btn.style.display=carrinho.length?'block':'none';
}
function remover(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};
document.getElementById('btnFinalizar').onclick=abrirForm;

function abrirForm(){
  const f=document.createElement('div');
  f.style.cssText=`position:fixed;inset:0;background:#fffaf5;overflow:auto;z-index:9999;padding:20px;`;
  f.innerHTML=`
  <h2 style="color:#b8860b;font-family:'Playfair Display',serif;">📋 Dados do Pedido</h2>
  <label>Nome</label><input id="nome">
  <label>E-mail</label><input id="email" type="email">
  <label>WhatsApp</label><input id="whats">
  <label>CEP</label><input id="cep" maxlength="9" onblur="buscarEndereco()">
  <label>Endereço</label><input id="endereco">
  <label>Número</label><input id="numero" type="number">
  <label>Bairro</label><input id="bairro" oninput="atualizarTotais()">
  <label>Complemento</label><input id="complemento">
  <label>Forma de Pagamento</label>
  <select id="pagamento">
    <option>Pix</option><option>Cartão</option><option>Dinheiro</option>
  </select>
  <label>Troco para (se dinheiro)</label><input id="troco">
  <p id="infoTotais"></p>
  <button style="background:#b8860b;color:#fff;border:none;padding:12px 20px;width:100%;border-radius:8px;font-weight:600;" onclick="enviarPedido()">Enviar Pedido</button>`;
  document.body.appendChild(f);
  atualizarTotais();
}

async function buscarEndereco(){
  const cep=document.getElementById('cep').value.replace(/\D/g,'');
  if(cep.length!==8)return;
  const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  const d=await r.json();
  if(d.erro)return alert('CEP não encontrado');
  document.getElementById('endereco').value=d.logradouro||'';
  document.getElementById('bairro').value=d.bairro||'';
  atualizarTotais();
}

function taxaPorBairro(b){const t={Centro:5,"Vila Brasil":8,"Santa Luzia":10};return t[b]||8;}
function atualizarTotais(){
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const bairro=document.getElementById('bairro')?.value||'';
  const taxa=taxaPorBairro(bairro);
  const total=subtotal+taxa;
  document.getElementById('infoTotais').innerHTML=`Subtotal: R$${subtotal.toFixed(2)}<br>Taxa: R$${taxa.toFixed(2)}<br><strong>Total: R$${total.toFixed(2)}</strong>`;
}

async function enviarPedido(){
  const nome=document.getElementById('nome').value.trim();
  const email=document.getElementById('email').value.trim();
  const whats=document.getElementById('whats').value.trim();
  const cep=document.getElementById('cep').value.trim();
  const endereco=document.getElementById('endereco').value.trim();
  const numero=document.getElementById('numero').value.trim();
  const bairro=document.getElementById('bairro').value.trim();
  const complemento=document.getElementById('complemento').value.trim();
  const pagamento=document.getElementById('pagamento').value;
  const troco=document.getElementById('troco').value;
  const taxa=taxaPorBairro(bairro);
  const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
  const total=subtotal+taxa;

  if(!nome||!email||!whats||!cep||!endereco||!bairro||!pagamento){
    alert("Preencha todos os campos obrigatórios.");return;
  }

  document.getElementById('overlay').style.display='flex';
  const payload={acao:"adicionar",nome,email,whats,cep,endereco,numero,bairro,complemento,pagamento,troco,
  itens:carrinho.map(i=>`${i.nome} x${i.qtd}`).join(', '),
  observacoes:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),
  subtotal,taxa,total};

  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    const t=await r.text();
    document.getElementById('overlay').style.display='none';
    if(t.includes('ok')){alert("✅ Pedido enviado com sucesso!");location.reload();}
    else alert("Erro ao salvar pedido.");
  }catch(e){
    document.getElementById('overlay').style.display='none';
    alert("⚠️ Erro de conexão.");
  }
}
</script>
