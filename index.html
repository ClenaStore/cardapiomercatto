<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍔 Mercatto Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fa;--card:#fff;--accent:#06b6d4;--ink:#111;--muted:#555;
  --radius:16px;--shadow:0 4px 10px rgba(0,0,0,0.08);
}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
header{
  background:var(--accent);color:#fff;text-align:center;padding:20px;border-radius:0 0 var(--radius) var(--radius);
}
.banner{
  margin:20px auto;width:90%;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);
}
.banner img{width:100%;display:block;}

.container{padding:10px 20px;}
h2{margin-top:20px;color:var(--accent);}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;
}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;}
.card-body h3{margin:0;font-size:16px;}
.card-body p{font-size:13px;color:var(--muted);}
.card-body span{font-weight:600;color:var(--accent);}
button.add{
  background:var(--accent);color:#fff;border:none;padding:8px;border-radius:var(--radius);
  width:100%;margin-top:8px;font-weight:600;cursor:pointer;
}
button.add:hover{opacity:.9;}

#cart-btn{
  position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;
  border:none;border-radius:50%;width:60px;height:60px;box-shadow:var(--shadow);
  font-size:24px;cursor:pointer;
}
#cart-count{
  position:absolute;top:5px;right:5px;background:#ef4444;color:#fff;
  font-size:12px;border-radius:50%;padding:2px 6px;
}
#cart-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
  justify-content:center;align-items:center;z-index:10;
}
.cart-content{
  background:#fff;width:90%;max-width:400px;border-radius:var(--radius);
  padding:20px;max-height:90vh;overflow:auto;
}
.cart-content h3{text-align:center;color:var(--accent);}
.item-line{display:flex;justify-content:space-between;align-items:center;margin:6px 0;}
.item-line input{width:60%;padding:4px;font-size:13px;}
.summary{margin-top:12px;border-top:1px solid #ddd;padding-top:10px;}
.finalizar{
  background:var(--accent);color:#fff;border:none;padding:10px;width:100%;
  border-radius:var(--radius);font-weight:600;margin-top:10px;
}
.finalizar:hover{opacity:.9;}
</style>
</head>
<body>

<header>
  <h1>🍔 Mercatto Delivery</h1>
</header>

<div class="banner">
  <img src="https://images.unsplash.com/photo-1601924582971-c77f2b9b1aa1?w=1200" alt="Banner">
</div>

<div class="container">
  <h2>Cardápio</h2>
  <div class="grid" id="menu"></div>
</div>

<button id="cart-btn">🛒<span id="cart-count">0</span></button>

<div id="cart-modal">
  <div class="cart-content">
    <h3>🧾 Seu Pedido</h3>
    <div id="cart-items"></div>

    <div class="summary">
      <label>Bairro:
        <select id="bairro">
          <option value="">Selecione</option>
          <option value="Centro" data-taxa="5">Centro - R$5,00</option>
          <option value="Jardins" data-taxa="8">Jardins - R$8,00</option>
          <option value="Santa Luzia" data-taxa="10">Santa Luzia - R$10,00</option>
        </select>
      </label>
      <p>Taxa de entrega: <span id="taxa">R$0,00</span></p>
      <p><strong>Total: <span id="total">R$0,00</span></strong></p>
      <button class="finalizar" id="btnFinalizar">Finalizar Pedido</button>
    </div>
  </div>
</div>

<script>
// CONFIGURAÇÃO DO ENDPOINT GOOGLE APPS SCRIPT
const ENDPOINT = "https://script.google.com/macros/s/AKfycbx5DEV71oL0i8vCfMZ62XawG30Qj_lhzz4nDha7LFklmWZTGxIRcl9fh-_p-PR8cxsi/exec"; // substitua depois

const produtos=[
  {id:1,nome:'X-Burger',desc:'Pão, carne, queijo, alface e tomate.',preco:15,img:'https://images.unsplash.com/photo-1606755962773-0f3d2d4b0c5b?w=400',sugestoes:[2,3]},
  {id:2,nome:'Refrigerante Lata',desc:'Lata 350ml',preco:5,img:'https://images.unsplash.com/photo-1606813902915-76ef7d1a6c4d?w=400',sugestoes:[]},
  {id:3,nome:'Batata Frita',desc:'Porção individual crocante.',preco:10,img:'https://images.unsplash.com/photo-1601924582971-c77f2b9b1aa1?w=400',sugestoes:[]}
];
let carrinho=[];

const menuDiv=document.getElementById('menu');
produtos.forEach(p=>{
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <img src="${p.img}" alt="${p.nome}">
    <div class="card-body">
      <h3>${p.nome}</h3>
      <p>${p.desc}</p>
      <span>R$${p.preco.toFixed(2)}</span>
      <button class="add" onclick="addCarrinho(${p.id})">Adicionar</button>
    </div>
  `;
  menuDiv.appendChild(c);
});

function addCarrinho(id){
  const prod=produtos.find(p=>p.id===id);
  const existe=carrinho.find(i=>i.id===id);
  if(existe){alert('Item já está no carrinho');return;}
  let obs=prompt('Alguma observação para este item? (opcional)')||'';
  carrinho.push({...prod,obs});
  renderCarrinho();
}

function renderCarrinho(){
  document.getElementById('cart-count').innerText=carrinho.length;
  const div=document.getElementById('cart-items');
  div.innerHTML='';
  let subtotal=0;
  carrinho.forEach((item,i)=>{
    subtotal+=item.preco;
    div.innerHTML+=`
      <div class="item-line">
        <span>${item.nome}</span>
        <button onclick="removeItem(${i})">❌</button>
      </div>
      <small>Obs: ${item.obs||'-'}</small>
    `;
    // Sugestões
    item.sugestoes.forEach(s=>{
      const sug=produtos.find(p=>p.id===s);
      if(sug && !carrinho.some(ci=>ci.id===s)){
        div.innerHTML+=`<div style="background:#f0f9ff;padding:6px;border-radius:8px;margin:4px 0">
          Sugestão: <strong>${sug.nome}</strong> - R$${sug.preco.toFixed(2)}
          <button onclick="addCarrinho(${sug.id})">Incluir</button>
        </div>`;
      }
    });
  });
  const bairroSel=document.getElementById('bairro');
  const taxa=parseFloat(bairroSel.selectedOptions[0]?.dataset.taxa||0);
  const total=subtotal+taxa;
  document.getElementById('taxa').innerText=`R$${taxa.toFixed(2)}`;
  document.getElementById('total').innerText=`R$${total.toFixed(2)}`;
}

function removeItem(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};
document.getElementById('bairro').onchange=renderCarrinho;

// FINALIZAÇÃO DO PEDIDO
document.getElementById('btnFinalizar').onclick=async ()=>{
  if(!carrinho.length)return alert('Carrinho vazio!');
  const nome=prompt('Nome completo:');
  const nasc=prompt('Data de nascimento (dd/mm/aaaa):');
  const whatsapp=prompt('WhatsApp (somente números):');
  const cep=prompt('CEP:');
  const endereco=await buscarEndereco(cep);
  const numero=prompt('Número da casa:');
  const ref=prompt('Ponto de referência:');
  const bairroSel=document.getElementById('bairro');
  const bairro=bairroSel.value;
  const taxa=parseFloat(bairroSel.selectedOptions[0]?.dataset.taxa||0);
  const subtotal=carrinho.reduce((s,i)=>s+i.preco,0);
  const total=subtotal+taxa;

  const payload={
    nome,nasc,whatsapp,cep,endereco,numero,ref,bairro,
    itens:carrinho.map(i=>i.nome).join(', '),
    observacoes:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),
    subtotal,taxa,total
  };

  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    const res=await r.text();
    alert('Pedido enviado com sucesso! Obrigado!');
    carrinho=[];renderCarrinho();
  }catch(e){
    alert('Erro ao enviar pedido.');
  }
};

// Função para buscar endereço via ViaCEP
async function buscarEndereco(cep){
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j=await r.json();
    return `${j.logradouro}, ${j.bairro} - ${j.localidade}/${j.uf}`;
  }catch{return prompt('Não foi possível localizar o endereço. Informe manualmente:');}
}
</script>
</body>
</html>
