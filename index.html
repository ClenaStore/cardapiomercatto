<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8860b">
<link rel="icon" sizes="192x192" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<link rel="apple-touch-icon" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercatto Delivery">

<title>🍽️ Mercatto Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/imask"></script>

<style>
/* 🎨 PALETA DE CORES */
:root{
  --bg:#f4f1ec;--card:#fffaf5;--accent:#b8860b;--ink:#3a2e1f;--muted:#6e6252;
  --radius:12px;--shadow:0 3px 8px rgba(0,0,0,0.08);
}

/* 🌿 BASE GERAL */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  font-family:'Inter',sans-serif;
  background:var(--bg);color:var(--ink);
  overflow-x:hidden;
  scroll-behavior:smooth;
}
body.modal-aberto{overflow:hidden;}

header{
  background:var(--accent);color:#fff;text-align:center;
  padding:20px 10px;font-family:'Playfair Display',serif;font-size:22px;
}

/* 📸 BANNER */
.banner{
  width:100%;max-width:600px;margin:15px auto;
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);border:3px solid #e0d7c5;
}
.banner img{width:100%;display:block;}

/* 🧭 CATEGORIAS */
.categorias{
  display:flex;overflow-x:auto;gap:10px;
  padding:10px;margin:0 auto 10px;scrollbar-width:none;
  -ms-overflow-style:none;max-width:600px;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  flex-shrink:0;background:var(--card);border:1px solid #e0d7c5;
  color:var(--accent);padding:8px 16px;border-radius:20px;
  font-weight:600;white-space:nowrap;cursor:pointer;
  transition:all .2s ease;box-shadow:var(--shadow);
}
.categorias button.active{background:var(--accent);color:#fff;}
.categorias button:hover{opacity:.85;}

/* 🧾 GRID DE PRODUTOS */
.container{
  padding:10px;margin:0 auto;max-width:600px;overflow:hidden;
}
h2{
  margin-top:10px;color:var(--accent);
  font-family:'Playfair Display',serif;
  border-bottom:1px solid #d7ccbb;padding-bottom:4px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:transform .2s;border:1px solid #e2d8c5;
}
.card:hover{transform:scale(1.02);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;}
.card-body h3{margin:0;font-size:16px;font-family:'Playfair Display',serif;}
.card-body p{font-size:13px;color:var(--muted);margin:4px 0;}
.card-body span{font-weight:600;color:var(--accent);}
button.add{
  background:var(--accent);color:#fff;border:none;
  padding:8px;border-radius:var(--radius);
  width:100%;margin-top:8px;font-weight:600;
  cursor:pointer;letter-spacing:.3px;
}
button.add:hover{opacity:.85;}

/* 🛒 BOTÃO DO CARRINHO */
#cart-btn{
  position:fixed;bottom:20px;right:20px;
  background:var(--accent);color:#fff;border:none;
  border-radius:50%;width:60px;height:60px;
  box-shadow:var(--shadow);font-size:24px;cursor:pointer;
  z-index:20;
}
#cart-count{
  position:absolute;top:6px;right:6px;
  background:#a12f2f;color:#fff;font-size:12px;
  border-radius:50%;padding:2px 6px;
}

/* 💬 MODAL DO CARRINHO */
#cart-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;justify-content:center;align-items:center;z-index:999;
  backdrop-filter:blur(3px);
}
#cart-modal.ativo ~ * {pointer-events:none;}
#cart-modal.ativo{display:flex;}
#cart-modal.ativo body{overflow:hidden;}

.cart-content{
  background:#fffaf5;width:90%;max-width:430px;
  border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:2px solid #e0d7c5;
  display:flex;flex-direction:column;align-items:stretch;
  max-height:90vh;overflow:hidden;
}
.cart-body{
  flex:1;overflow-y:auto;padding-right:6px;scrollbar-width:thin;
}
.cart-body::-webkit-scrollbar{width:6px;}
.cart-body::-webkit-scrollbar-thumb{background:#d7ccbb;border-radius:6px;}
.cart-content h3{
  text-align:center;color:var(--accent);
  font-family:'Playfair Display',serif;margin-bottom:12px;
}

/* LINHAS DO CARRINHO */
.item-line{
  display:flex;justify-content:space-between;
  align-items:center;margin:6px 0;padding-bottom:6px;
  border-bottom:1px solid #e6dcc8;
}
.summary{margin-top:15px;border-top:2px solid #d7ccbb;padding-top:10px;}
.finalizar{
  background:var(--accent);color:#fff;border:none;padding:10px;width:100%;
  border-radius:var(--radius);font-weight:600;margin-top:10px;letter-spacing:.3px;
}

/* CAMPOS DO FORMULÁRIO */
input,select{
  width:100%;padding:10px;margin:6px 0 12px;
  border:1px solid #d7ccbb;border-radius:8px;
  font-size:15px;background:#fffefb;
}
label{font-size:13px;font-weight:600;color:var(--muted);}
#infoTotais{font-size:14px;margin-top:-4px;color:var(--muted);}
#infoTotais p strong{color:var(--accent);}

/* 🔄 OVERLAY DE CARREGAMENTO */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  display:none;align-items:center;justify-content:center;
  z-index:9999;color:#fff;font-size:18px;
  flex-direction:column;text-align:center;
}
#overlay img{width:100px;margin-bottom:20px;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}

/* 🎞️ GALERIA DE IMAGENS */
.galeria {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 4px;
  scroll-snap-type: x mandatory;
}
.galeria img {
  flex-shrink: 0;
  width: 100%;
  max-width: 180px;
  height: 120px;
  object-fit: cover;
  border-radius: var(--radius);
  scroll-snap-align: start;
}
</style>
</head>

<body>
<header>🍽️ Mercatto Delivery</header>

<!-- 📸 BANNER PRINCIPAL -->
<div class="banner">
  <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" alt="Banner principal">
</div>

<!-- 🧭 BOTÕES DE CATEGORIA -->
<div class="categorias" id="categorias"></div>

<!-- 🧾 LISTAGEM DE PRODUTOS -->
<div class="container">
  <h2 id="tituloCategoria">Cardápio</h2>
  <div class="grid" id="menu"></div>
</div>

<!-- 🛒 BOTÃO FIXO DO CARRINHO -->
<button id="cart-btn">🛒<span id="cart-count">0</span></button>

<!-- 💬 MODAL DO CARRINHO -->
<div id="cart-modal">
  <div class="cart-content">
    <h3>🧾 Seu Pedido</h3>
    <div class="cart-body">
      <div id="cart-items"></div>
      <div class="summary" id="formCliente" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- ⏳ OVERLAY DE ENVIO -->
<div id="overlay">
  <img src="https://i.imgur.com/8Km9tLL.png" alt="logo">
  <p>Enviando seu pedido...<br>Por favor, aguarde 🕒</p>
</div>

<!-- 📲 BOTÃO DE INSTALAÇÃO PWA -->
<button id="btnInstall" style="
  position:fixed;bottom:20px;left:20px;z-index:9999;
  background:#b8860b;color:#fff;border:none;
  border-radius:30px;padding:12px 22px;
  font-weight:600;box-shadow:0 3px 6px rgba(0,0,0,0.25);
  display:none;">📲 Baixar App</button>

<script>
/* ✅ REGISTRO SERVICE WORKER + INSTALAÇÃO PWA */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => console.log('Service Worker registrado:', reg.scope))
    .catch(err => console.error('Erro no SW:', err));
}
let deferredPrompt;
const btnInstall = document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = 'block';
});
btnInstall.addEventListener('click', async () => {
  btnInstall.style.display = 'none';
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('Instalação:', outcome);
  deferredPrompt = null;
});
if (navigator.userAgent.match(/iphone|ipad|ipod/i)) {
  setTimeout(() => {
    if (!window.matchMedia('(display-mode: standalone)').matches) {
      alert('📲 Para instalar, toque em "Compartilhar" (ícone ↗) e escolha "Adicionar à Tela de Início".');
    }
  }, 3000);
}

/* 🔗 ENDPOINT DO GOOGLE APPS SCRIPT */
const ENDPOINT="https://script.google.com/macros/s/AKfycbyLxzKH1MflYrVBEzEd4JaYYbAkNi5R13YWzDO9ywt2tqsx113TLYybORrKYGURowak/exec";

/* 🍔 PRODUTOS DISPONÍVEIS (com suporte a fotos e vídeos) */
const produtos = [
  {
    id: 1,
    nome: 'X-Burger',
    desc: 'Pão brioche, carne artesanal e queijo.',
    preco: 18,
    categoria: 'Lanches',
    img: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400',
    /*imagens: [
      'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400',
      'https://images.unsplash.com/photo-1561758033-7a51a0e4b39a?w=400'
    ],*/
    /*video: 'https://www.w3schools.com/html/mov_bbb.mp4'*/
  },
  {id:2,nome:'X-Bacon',desc:'Hambúrguer, queijo e bacon.',preco:22,img:'https://images.unsplash.com/photo-1601050690597-6c0c9f57f3c7?w=400',categoria:'Lanches'},
  {id:3,nome:'Batata Frita',desc:'Porção individual crocante.',preco:12,img:'https://images.unsplash.com/photo-1606756790138-640a2f1f02c0?w=400',categoria:'Acompanhamentos'},
  {id:4,nome:'Anéis de Cebola',desc:'Crocantes e saborosos.',preco:10,img:'https://images.unsplash.com/photo-1601924928361-0f56d1a1f4d2?w=400',categoria:'Acompanhamentos'},
  {id:5,nome:'Refrigerante Lata',desc:'Lata 350ml',preco:6,img:'https://images.unsplash.com/photo-1613470209869-1b4b4a1c1db2?w=400',categoria:'Bebidas'},
  {id:6,nome:'Suco Natural',desc:'Suco de frutas naturais 300ml.',preco:8,img:'https://images.unsplash.com/photo-1577805947697-89e18249d767?w=400',categoria:'Bebidas'}
];

let carrinho=[],categoriaAtiva='';
const categoriasDiv=document.getElementById('categorias');
const menuDiv=document.getElementById('menu');
const titulo=document.getElementById('tituloCategoria');
const categoriasUnicas=[...new Set(produtos.map(p=>p.categoria))];
categoriasUnicas.forEach((cat,i)=>{
  const btn=document.createElement('button');
  btn.textContent=cat;
  btn.onclick=()=>filtrarCategoria(cat);
  if(i===0){btn.classList.add('active');categoriaAtiva=cat;}
  categoriasDiv.appendChild(btn);
});
filtrarCategoria(categoriaAtiva);

/* 🧾 FILTRA E EXIBE PRODUTOS */
function filtrarCategoria(cat){
  categoriaAtiva=cat;
  titulo.innerText=cat;
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...categoriasDiv.children].find(b=>b.textContent===cat)?.classList.add('active');
  menuDiv.innerHTML='';

  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card';

    // 🔹 Mídia principal (foto, galeria ou vídeo)
    let midiaHTML = `<img src="${p.img}" alt="${p.nome}">`;

    /* ✅ GALERIA DE IMAGENS
    if (p.imagens && p.imagens.length > 0) {
      midiaHTML = `
        <div class="galeria">
          ${p.imagens.map(url => `<img src="${url}" alt="${p.nome}">`).join('')}
        </div>
      `;
    } */

    /* ✅ VÍDEO DO PRODUTO
    if (p.video) {
      midiaHTML = `
        <video controls poster="${p.img}" style="width:100%;border-radius:12px;">
          <source src="${p.video}" type="video/mp4">
          Seu navegador não suporta vídeos.
        </video>
      `;
    } */

    c.innerHTML = `
      ${midiaHTML}
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <span>R$${p.preco.toFixed(2)}</span>
        <button class="add" onclick="addCarrinho(${p.id})">Adicionar</button>
      </div>`;
    menuDiv.appendChild(c);
  });
}

/* ➕ CARRINHO + ENVIO (mantido igual ao seu código anterior) */
function addCarrinho(id){
  const prod=produtos.find(p=>p.id===id);
  if(carrinho.find(i=>i.id===id)){alert('Item já está no carrinho');return;}
  let obs=prompt('Alguma observação para este item? (opcional)')||'';
  carrinho.push({...prod,obs});
  renderCarrinho();
}
function renderCarrinho(){
  document.getElementById('cart-count').innerText=carrinho.length;
  const div=document.getElementById('cart-items');div.innerHTML='';
  carrinho.forEach((item,i)=>{
    div.innerHTML+=`
      <div class="item-line">
        <span>${item.nome}</span>
        <button onclick="removeItem(${i})">✖</button>
      </div>
      <small>Obs: ${item.obs||'-'}</small>`;
  });
  if(carrinho.length)div.innerHTML+=`<button class="finalizar" onclick="abrirFormCliente()">Continuar</button>`;
}
function removeItem(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};

/* 🧾 FORMULÁRIO E ENVIO (idêntico ao seu) */
async function enviarPedido(nome,whats,cep,endereco,numero,bairro,forma,precisa,troco,taxa,subtotal,total){
  document.getElementById('overlay').style.display='flex';
  const payload = {
    acao: "adicionar",
    nome,whats,cep,endereco,numero,bairro,forma,precisa,troco,
    itens: carrinho.map(i=>i.nome).join(', '),
    observacoes: carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),
    subtotal,taxa,total
  };

  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const t = await r.text();

    document.getElementById('overlay').style.display='none';

    if (t.includes("ok")) {
      // 🧹 Limpa carrinho e fecha modal
      carrinho = [];
      document.getElementById('cart-modal').style.display = 'none';
      renderCarrinho();

      // ✅ Mensagem de sucesso
      alert("✅ Pedido enviado com sucesso! Aguarde a confirmação.");
    } else {
      alert("❌ Erro ao registrar o pedido na planilha.");
    }

  } catch (e) {
    document.getElementById('overlay').style.display='none';
    alert("⚠️ Erro de conexão. Tente novamente em alguns segundos.");
    console.error(e);
  }
}
</script>

</body>
</html>
