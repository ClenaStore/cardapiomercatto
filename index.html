<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mercatto Delivery</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8860b">
<link rel="apple-touch-icon" href="https://github.com/ClenaStore/cardapiomercatto/blob/main/icons/logo.png?raw=true">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f19;--card:#161d2f;--gold:#b8860b;--lightgold:#ffcc70;--text:#f8fafc;--muted:#a1a1aa;--shadow:0 5px 20px rgba(0,0,0,.4);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
header{background:linear-gradient(90deg,#000,#2b1a03);padding:18px;text-align:center;color:var(--lightgold);font-family:'Playfair Display',serif;font-size:24px;letter-spacing:.6px;box-shadow:var(--shadow);}
.banner{width:100%;height:40vh;max-height:420px;overflow:hidden;position:relative;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.8);}
.search-area{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:90%;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border-radius:50px;padding:6px 14px;}
.search-area input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;}
.search-area input::placeholder{color:#ccc;}
.search-area button{background:var(--gold);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);font-size:20px;position:relative;}
#cart-count{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;}
.categorias{display:flex;overflow-x:auto;padding:12px;gap:10px;scrollbar-width:none;}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{flex-shrink:0;background:#1e293b;border:1px solid var(--gold);color:var(--lightgold);padding:10px 18px;border-radius:25px;cursor:pointer;font-weight:600;transition:.3s;}
.categorias button.active,.categorias button:hover{background:var(--gold);color:#000;transform:scale(1.05);}
.container{padding:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.06);transition:.25s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-4px);border-color:var(--lightgold);}
.card-media{width:100%;height:150px;overflow:hidden;}
.card-media img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:12px;display:flex;flex-direction:column;flex:1;}
.card-body h3{font-family:'Playfair Display',serif;color:var(--lightgold);margin-bottom:4px;font-size:16px;}
.card-body p{font-size:13px;color:var(--muted);margin-bottom:8px;flex-grow:1;}
.card-body span{font-weight:600;color:var(--gold);margin-bottom:8px;}
.card-body button{background:var(--gold);border:none;border-radius:25px;padding:8px;color:#000;font-weight:600;cursor:pointer;transition:.2s;}
.card-body button:hover{background:var(--lightgold);}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.popup-content{background:#151d2f;border-radius:var(--radius);max-width:430px;width:100%;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.popup-body{padding:18px;}
.popup-body h2{font-family:'Playfair Display',serif;color:var(--lightgold);margin-bottom:10px;}
.popup-body label{font-weight:600;color:var(--lightgold);font-size:14px;}
.popup-body input,textarea,select{width:100%;margin-top:6px;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;}
.popup-body button{margin-top:14px;width:100%;padding:12px;border:none;border-radius:var(--radius);background:var(--gold);font-weight:600;cursor:pointer;}
.popup-body button:hover{background:var(--lightgold);}
.close-btn{position:absolute;top:15px;right:15px;background:none;border:none;color:var(--lightgold);font-size:22px;cursor:pointer;}
</style>
</head>

<body>
<header>Mercatto Delivery</header>

<div class="banner">
  <img src="./paste/CAPA MERCATTO.png">
  <div class="search-area">
    <input id="busca" placeholder="Buscar pratos, bebidas..." oninput="buscarItem()">
    <button onclick="abrirUser()">👤</button>
    <button onclick="abrirCarrinho()">🛒<span id="cart-count">0</span></button>
  </div>
</div>

<div class="categorias" id="categorias"></div>
<div class="container"><div class="grid" id="menu"></div></div>

<script>
/****************************************************
🍝 MERCATTO DELIVERY - SISTEMA COMPLETO
****************************************************/
const ENDPOINT="https://script.google.com/macros/s/AKfycbwbwcFcu0riYvQVrZ68cCZQfTFh9-DAwWapjo095CNShLjQvtLFvFD6rxfVCH4u_B4k/exec";
const STORAGE={cliente:'mercatto_cliente',carrinho:'mercatto_carrinho'};
function salvar(k,v){localStorage.setItem(k,JSON.stringify(v));}
function carregar(k){return JSON.parse(localStorage.getItem(k)||"{}");}
let cliente=carregar(STORAGE.cliente)||{},carrinho=carregar(STORAGE.carrinho)||[];

// Produtos (exemplo resumido — insira todos os seus produtos aqui)
const produtos=[
{id:1,nome:"Risoto de Camarão",desc:"Arroz arbóreo cremoso com camarões flambados e champignon.",preco:116.90,img:"https://github.com/ClenaStore/cardapiomercatto/blob/main/paste/Captura%20de%20tela%202025-10-24%20101231.png?raw=true",categoria:"Pratos"},
{id:2,nome:"Polvo Braseado",desc:"Tentáculos de polvo braseados no azeite de ervas com batata baby.",preco:163.90,img:"./paste/polvo braseado.png",categoria:"Pratos"},
{id:3,nome:"New York Burger",desc:"Duplo hambúrguer Angus, cheddar duplo e bacon crocante.",preco:54.90,img:"img/padrao.jpg",categoria:"Burguers"},
{id:4,nome:"Hot Philadelphia",desc:"Sushi de salmão empanado crocante e cremoso.",preco:85.30,img:"img/padrao.jpg",categoria:"Sushis"},
{id:5,nome:"Pudim Golden",desc:"Pudim dourado e cremoso, textura aveludada que derrete na boca.",preco:34.90,img:"img/padrao.jpg",categoria:"Sobremesas"},
{id:6,nome:"Camarão Mercatto 2 Pessoas",desc:"Camarão grelhado com creme de leite e arroz.",preco:175.50,img:"img/padrao.jpg",categoria:"Pratos"},
{id:7,nome:"Salmão Crocante",desc:"Salmão grelhado em crosta de pão e purê de gorgonzola.",preco:149.90,img:"img/padrao.jpg",categoria:"Pratos"}
];

// Render categorias
const categorias=[...new Set(produtos.map(p=>p.categoria))];
const catDiv=document.getElementById("categorias");
categorias.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;if(i===0)b.classList.add("active");b.onclick=()=>filtrar(c);catDiv.appendChild(b);});
filtrar(categorias[0]);

function filtrar(cat){
document.querySelectorAll(".categorias button").forEach(b=>b.classList.remove("active"));
[...catDiv.children].find(b=>b.textContent===cat).classList.add("active");
renderizar(produtos.filter(p=>p.categoria===cat));
}

function buscarItem(){
const termo=document.getElementById("busca").value.toLowerCase();
if(!termo)return filtrar(document.querySelector(".categorias button.active").textContent);
renderizar(produtos.filter(p=>p.nome.toLowerCase().includes(termo)||p.desc.toLowerCase().includes(termo)));
}

// Render produtos
function renderizar(lista){
const menu=document.getElementById("menu");menu.innerHTML="";
lista.forEach(p=>{
const card=document.createElement("div");
card.classList.add("card");
card.innerHTML=`
<div class="card-media"><img src="${p.img}"></div>
<div class="card-body">
<h3>${p.nome}</h3>
<p>${p.desc}</p>
<span>R$ ${p.preco.toFixed(2)}</span>
<button onclick="adicionar(${p.id})">Adicionar</button>
</div>`;
menu.appendChild(card);
});
}

// Adicionar ao carrinho
function adicionar(id){
const p=produtos.find(x=>x.id===id);
const item=carrinho.find(i=>i.id===id);
if(item)item.qtd++;else carrinho.push({...p,qtd:1});
salvar(STORAGE.carrinho,carrinho);
atualizarCarrinho();
alert(`${p.nome} adicionado!`);
}

function atualizarCarrinho(){document.getElementById("cart-count").textContent=carrinho.reduce((s,i)=>s+i.qtd,0);}

// Carrinho
function abrirCarrinho(){
if(!carrinho.length)return alert("Carrinho vazio!");
const total=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
const div=document.createElement("div");div.classList.add("popup");
div.innerHTML=`
<div class="popup-content">
<button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
<div class="popup-body">
<h2>🛒 Finalizar Pedido</h2>
${carrinho.map(i=>`<p>${i.nome} x${i.qtd} - R$ ${(i.qtd*i.preco).toFixed(2)}</p>`).join("")}
<hr><h3>Total: R$ ${total.toFixed(2)}</h3>
<label>Endereço:</label><input id="endereco" placeholder="Rua, nº, bairro">
<label>Pagamento:</label><select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
<label>Usar Pontos (100pts = R$1):</label><input id="usarPontos" type="number" min="0" value="0">
<button onclick="finalizarPedido()">Confirmar Pedido</button>
</div></div>`;
document.body.appendChild(div);
}

// Enviar pedido
async function finalizarPedido(){
if(!cliente.email)return alert("Faça login primeiro.");
const end=document.getElementById("endereco").value;
const pag=document.getElementById("pagamento").value;
const usarPontos=parseInt(document.getElementById("usarPontos").value)||0;
const subtotal=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
let total=subtotal;
if(usarPontos>0){
const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"usarPontos",email:cliente.email,pontos:usarPontos})});
const d=await r.json();
if(d.sucesso){total-=d.desconto;alert(`Desconto de R$${d.desconto.toFixed(2)} aplicado!`);}
else alert(d.mensagem);
}
await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"pedido",cliente,itens:carrinho.map(i=>`${i.nome}x${i.qtd}`).join(", "),subtotal,total,endereco:end,pagamento:pag})});
const pontos=Math.floor(total);
await fetch(ENDPOINT,{method:"POST",body:JSON.stringify({acao:"adicionarPontos",email:cliente.email,pontos})});
alert(`✅ Pedido enviado!\n💎 Você ganhou ${pontos} pontos.`);
carrinho=[];salvar(STORAGE.carrinho,carrinho);atualizarCarrinho();document.querySelector(".popup")?.remove();
}

// Perfil
function abrirUser(){
if(!cliente.email)return alert("Faça login.");
const div=document.createElement("div");div.classList.add("popup");
div.innerHTML=`
<div class="popup-content">
<button class="close-btn" onclick="this.closest('.popup').remove()">✖</button>
<div class="popup-body">
<h2>${cliente.nome||"Cliente"}</h2>
<p>${cliente.email}</p>
<p>💎 Pontos: <span id="saldoPontos">...</span></p>
<button onclick="sair()">Sair</button>
</div></div>`;
document.body.appendChild(div);carregarPontos(cliente.email);
}
async function carregarPontos(email){
const r=await fetch(\`\${ENDPOINT}?acao=getUsuario&email=\${email}\`);
const d=await r.json();
document.getElementById("saldoPontos").textContent=d.usuario?.pontos||0;
}
function sair(){localStorage.removeItem(STORAGE.cliente);cliente={};alert("Saiu da conta.");}
</script>
</body>
</html>
