<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍽️ Mercatto Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/imask"></script>
<style>
:root{
  --bg:#f4f1ec;
  --card:#fffaf5;
  --accent:#b8860b;
  --ink:#3a2e1f;
  --muted:#6e6252;
  --radius:12px;
  --shadow:0 3px 8px rgba(0,0,0,0.08);
}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header{
  background:var(--accent);
  color:#fff;
  text-align:center;
  padding:20px 10px;
  font-family:'Playfair Display',serif;
  letter-spacing:0.5px;
  font-size:22px;
}
.banner{
  width:92%;
  margin:20px auto;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  border:3px solid #e0d7c5;
}
.banner img{width:100%;display:block;}

.container{padding:10px 20px;}
h2{
  margin-top:10px;
  color:var(--accent);
  font-family:'Playfair Display',serif;
  border-bottom:1px solid #d7ccbb;
  padding-bottom:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .2s;
  border:1px solid #e2d8c5;
}
.card:hover{transform:scale(1.02);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;}
.card-body h3{
  margin:0;font-size:16px;font-family:'Playfair Display',serif;
}
.card-body p{font-size:13px;color:var(--muted);margin:4px 0;}
.card-body span{font-weight:600;color:var(--accent);}
button.add{
  background:var(--accent);
  color:#fff;border:none;padding:8px;border-radius:var(--radius);
  width:100%;margin-top:8px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;letter-spacing:.3px;
}
button.add:hover{opacity:.85;}

#cart-btn{
  position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;
  border:none;border-radius:50%;width:60px;height:60px;box-shadow:var(--shadow);
  font-size:24px;cursor:pointer;
}
#cart-count{
  position:absolute;top:5px;right:5px;background:#a12f2f;color:#fff;
  font-size:12px;border-radius:50%;padding:2px 6px;
}
#cart-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;
  justify-content:center;align-items:center;z-index:10;
}
.cart-content{
  background:#fffaf5;width:90%;max-width:430px;border-radius:var(--radius);
  padding:20px;max-height:90vh;overflow:auto;
  box-shadow:var(--shadow);
  border:2px solid #e0d7c5;
}
.cart-content h3{
  text-align:center;
  color:var(--accent);
  font-family:'Playfair Display',serif;
  margin-bottom:12px;
}
.item-line{
  display:flex;justify-content:space-between;align-items:center;
  margin:6px 0;padding-bottom:6px;border-bottom:1px solid #e6dcc8;
}
.summary{margin-top:15px;border-top:2px solid #d7ccbb;padding-top:10px;}
.finalizar{
  background:var(--accent);
  color:#fff;border:none;padding:10px;width:100%;
  border-radius:var(--radius);font-weight:600;margin-top:10px;
  letter-spacing:.3px;
}
.finalizar:hover{opacity:.9;}
input,select{
  width:100%;padding:8px;margin:4px 0 10px;border:1px solid #d7ccbb;
  border-radius:8px;font-size:14px;background:#fffefb;
}
label{font-size:13px;font-weight:600;color:var(--muted);}
</style>
</head>
<body>

<header>🍽️ Mercatto Delivery</header>

<div class="banner">
  <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" alt="Banner principal">
</div>

<div class="container">
  <h2>Cardápio</h2>
  <div class="grid" id="menu"></div>
</div>

<button id="cart-btn">🛒<span id="cart-count">0</span></button>

<div id="cart-modal">
  <div class="cart-content">
    <h3>🧾 Seu Pedido</h3>
    <div id="cart-items"></div>
    <div class="summary" id="formCliente" style="display:none;"></div>
  </div>
</div>

<script>
// ENDPOINT DO GOOGLE APPS SCRIPT
const ENDPOINT = "https://script.google.com/macros/s/AKfycbx5DEV71oL0i8vCfMZ62XawG30Qj_lhzz4nDha7LFklmWZTGxIRcl9fh-_p-PR8cxsi/exec";

const produtos=[
  {id:1,nome:'X-Burger',desc:'Pão brioche, carne artesanal e queijo.',preco:18,img:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400',sugestoes:[2,3]},
  {id:2,nome:'Refrigerante Lata',desc:'Lata 350ml',preco:6,img:'https://images.unsplash.com/photo-1613470209869-1b4b4a1c1db2?w=400',sugestoes:[]},
  {id:3,nome:'Batata Frita',desc:'Porção individual crocante.',preco:12,img:'https://images.unsplash.com/photo-1606756790138-640a2f1f02c0?w=400',sugestoes:[]}
];
let carrinho=[];

const menuDiv=document.getElementById('menu');
produtos.forEach(p=>{
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <img src="${p.img}" alt="${p.nome}">
    <div class="card-body">
      <h3>${p.nome}</h3>
      <p>${p.desc}</p>
      <span>R$${p.preco.toFixed(2)}</span>
      <button class="add" onclick="addCarrinho(${p.id})">Adicionar</button>
    </div>`;
  menuDiv.appendChild(c);
});

function addCarrinho(id){
  const prod=produtos.find(p=>p.id===id);
  const existe=carrinho.find(i=>i.id===id);
  if(existe){alert('Item já está no carrinho');return;}
  let obs=prompt('Alguma observação para este item? (opcional)')||'';
  carrinho.push({...prod,obs});
  renderCarrinho();
}

function renderCarrinho(){
  document.getElementById('cart-count').innerText=carrinho.length;
  const div=document.getElementById('cart-items');
  div.innerHTML='';
  let subtotal=0;
  carrinho.forEach((item,i)=>{
    subtotal+=item.preco;
    div.innerHTML+=`
      <div class="item-line">
        <span>${item.nome}</span>
        <button onclick="removeItem(${i})">✖</button>
      </div>
      <small>Obs: ${item.obs||'-'}</small>
    `;
    item.sugestoes.forEach(s=>{
      const sug=produtos.find(p=>p.id===s);
      if(sug && !carrinho.some(ci=>ci.id===s)){
        div.innerHTML+=`<div style="background:#fff8e3;padding:6px;border-radius:8px;margin:4px 0;border:1px solid #e3d5b5;">
          Sugestão: <strong>${sug.nome}</strong> - R$${sug.preco.toFixed(2)}
          <button class="add" style="padding:3px 6px;font-size:12px;" onclick="addCarrinho(${sug.id})">Incluir</button>
        </div>`;
      }
    });
  });
  if(carrinho.length)div.innerHTML+=`<button class="finalizar" onclick="abrirFormCliente()">Continuar</button>`;
}

function removeItem(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};

function abrirFormCliente(){
  const form=document.getElementById('formCliente');
  form.style.display='block';
  form.innerHTML=`
    <h3>📋 Dados do Cliente</h3>
    <label>Nome completo</label><input id="nome">
    <label>Data de nascimento</label><input type="date" id="nasc">
    <label>WhatsApp</label><input id="whats">
    <label>CEP</label><input id="cep" maxlength="9" onblur="buscarEndereco()">
    <label>Endereço</label><input id="endereco">
    <label>Número</label><input id="numero">
    <label>Ponto de referência</label><input id="ref">
    <label>Bairro</label>
    <select id="bairro">
      <option value="">Selecione</option>
      <option value="Centro" data-taxa="5">Centro - R$5,00</option>
      <option value="Jardins" data-taxa="8">Jardins - R$8,00</option>
      <option value="Santa Luzia" data-taxa="10">Santa Luzia - R$10,00</option>
    </select>
    <button class="finalizar" onclick="mostrarResumo()">Ver Resumo</button>
  `;
  IMask(document.getElementById('whats'), {mask: '(00) 00000-0000'});
}

// Busca endereço via CEP e define bairro automaticamente
async function buscarEndereco(){
  const cepInput = document.getElementById('cep');
  const cep = cepInput.value.replace(/\D/g,'');
  if(cep.length != 8) return;

  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j = await r.json();

    if(j.erro){
      alert('CEP não encontrado. Preencha o endereço manualmente.');
      return;
    }

    // Preenche o endereço completo
    document.getElementById('endereco').value = `${j.logradouro}, ${j.bairro} - ${j.localidade}`;

    // Tenta encontrar o bairro correspondente
    const bairroSelect = document.getElementById('bairro');
    let encontrou = false;
    for (let opt of bairroSelect.options){
      if(opt.value && j.bairro && j.bairro.toLowerCase().includes(opt.value.toLowerCase())){
        bairroSelect.value = opt.value;
        encontrou = true;
        break;
      }
    }

    // Se não encontrar, deixa o usuário escolher manualmente
    if(!encontrou){
      bairroSelect.value = "";
    }

  } catch (e) {
    alert('Erro ao consultar CEP. Tente novamente.');
  }
}

function mostrarResumo(){
  const nome=document.getElementById('nome').value.trim();
  const nasc=document.getElementById('nasc').value;
  const whatsapp=document.getElementById('whats').value.trim();
  const cep=document.getElementById('cep').value.trim();
  const endereco=document.getElementById('endereco').value.trim();
  const numero=document.getElementById('numero').value.trim();
  const ref=document.getElementById('ref').value.trim();
  const bairroSel=document.getElementById('bairro');
  const bairro=bairroSel.value;
  const taxa=parseFloat(bairroSel.selectedOptions[0]?.dataset.taxa||0);
  const subtotal=carrinho.reduce((s,i)=>s+i.preco,0);
  const total=subtotal+taxa;

  if(!nome||!whatsapp||!bairro){alert('Preencha os campos obrigatórios.');return;}

  const form=document.getElementById('formCliente');
  form.innerHTML=`
    <h3>📦 Resumo do Pedido</h3>
    <p><strong>Cliente:</strong> ${nome}</p>
    <p><strong>Endereço:</strong> ${endereco}, ${numero} - ${bairro}</p>
    <p><strong>WhatsApp:</strong> ${whatsapp}</p>
    <p><strong>Subtotal:</strong> R$${subtotal.toFixed(2)}</p>
    <p><strong>Taxa de entrega:</strong> R$${taxa.toFixed(2)}</p>
    <h3>Total: R$${total.toFixed(2)}</h3>
    <button class="finalizar" onclick="enviarPedido('${nome}','${nasc}','${whatsapp}','${cep}','${endereco}','${numero}','${ref}','${bairro}',${taxa},${subtotal},${total})">Enviar Pedido</button>
  `;
}

async function enviarPedido(nome,nasc,whatsapp,cep,endereco,numero,ref,bairro,taxa,subtotal,total){
  const payload={
    acao:"adicionar",
    nome,nasc,whatsapp,cep,endereco,numero,ref,bairro,
    itens:carrinho.map(i=>i.nome).join(', '),
    observacoes:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),
    subtotal,taxa,total
  };
  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    const txt=await r.text();
    if(txt.includes("ok")){
      alert("✅ Pedido enviado com sucesso!");
      carrinho=[];document.getElementById('cart-modal').style.display='none';
      renderCarrinho();
    }else{
      alert("❌ Erro ao registrar pedido. Tente novamente.");
    }
  }catch(e){alert("Erro de conexão com o servidor.");}
}
</script>
</body>
</html>
