<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🍽️ Mercatto Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/imask"></script>
<style>
:root{
  --bg:#f4f1ec;--card:#fffaf5;--accent:#b8860b;--ink:#3a2e1f;--muted:#6e6252;
  --radius:12px;--shadow:0 3px 8px rgba(0,0,0,0.08);
}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
header{
  background:var(--accent);color:#fff;text-align:center;padding:20px 10px;
  font-family:'Playfair Display',serif;font-size:22px;
}
.banner{width:92%;margin:20px auto;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:3px solid #e0d7c5;}
.banner img{width:100%;display:block;}
.categorias{
  display:flex;overflow-x:auto;gap:10px;padding:10px 15px;margin-top:-10px;margin-bottom:10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.categorias::-webkit-scrollbar{display:none;}
.categorias button{
  background:var(--card);border:1px solid #e0d7c5;color:var(--accent);
  padding:8px 16px;border-radius:20px;font-weight:600;white-space:nowrap;cursor:pointer;
  transition:all .2s ease;box-shadow:var(--shadow);
}
.categorias button.active{background:var(--accent);color:#fff;}
.categorias button:hover{opacity:.85;}
.container{padding:10px 20px;}
h2{margin-top:10px;color:var(--accent);font-family:'Playfair Display',serif;border-bottom:1px solid #d7ccbb;padding-bottom:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;transition:transform .2s;border:1px solid #e2d8c5;
}
.card:hover{transform:scale(1.02);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;}
.card-body h3{margin:0;font-size:16px;font-family:'Playfair Display',serif;}
.card-body p{font-size:13px;color:var(--muted);margin:4px 0;}
.card-body span{font-weight:600;color:var(--accent);}
button.add{
  background:var(--accent);color:#fff;border:none;padding:8px;border-radius:var(--radius);
  width:100%;margin-top:8px;font-weight:600;cursor:pointer;letter-spacing:.3px;
}
button.add:hover{opacity:.85;}
#cart-btn{
  position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;
  border:none;border-radius:50%;width:60px;height:60px;box-shadow:var(--shadow);
  font-size:24px;cursor:pointer;
}
#cart-count{position:absolute;top:5px;right:5px;background:#a12f2f;color:#fff;font-size:12px;border-radius:50%;padding:2px 6px;}
#cart-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;justify-content:center;align-items:center;z-index:10;}
.cart-content{
  background:#fffaf5;width:90%;max-width:430px;border-radius:var(--radius);padding:20px;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow);border:2px solid #e0d7c5;
}
.cart-content h3{text-align:center;color:var(--accent);font-family:'Playfair Display',serif;margin-bottom:12px;}
.item-line{display:flex;justify-content:space-between;align-items:center;margin:6px 0;padding-bottom:6px;border-bottom:1px solid #e6dcc8;}
.summary{margin-top:15px;border-top:2px solid #d7ccbb;padding-top:10px;}
.finalizar{
  background:var(--accent);color:#fff;border:none;padding:10px;width:100%;
  border-radius:var(--radius);font-weight:600;margin-top:10px;letter-spacing:.3px;
}
input,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d7ccbb;border-radius:8px;font-size:15px;background:#fffefb;}
label{font-size:13px;font-weight:600;color:var(--muted);}
.nasc-row{display:flex;gap:8px;align-items:center;}
.nasc-row input, .nasc-row select{flex:1;}
#infoTotais{font-size:14px;margin-top:-4px;color:var(--muted);}
#infoTotais p strong{color:var(--accent);}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  display:none;align-items:center;justify-content:center;z-index:9999;
  color:#fff;font-size:18px;flex-direction:column;text-align:center;
}
#overlay img{width:100px;margin-bottom:20px;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
</style>
</head>
<body>

<header>🍽️ Mercatto Delivery</header>

<div class="banner">
  <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" alt="Banner principal">
</div>

<div class="categorias" id="categorias"></div>

<div class="container">
  <h2 id="tituloCategoria">Cardápio</h2>
  <div class="grid" id="menu"></div>
</div>

<button id="cart-btn">🛒<span id="cart-count">0</span></button>

<div id="cart-modal">
  <div class="cart-content">
    <h3>🧾 Seu Pedido</h3>
    <div id="cart-items"></div>
    <div class="summary" id="formCliente" style="display:none;"></div>
  </div>
</div>

<div id="overlay">
  <img src="https://i.imgur.com/8Km9tLL.png" alt="logo">
  <p>Enviando seu pedido...<br>Por favor, aguarde 🕒</p>
</div>

<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbyLxzKH1MflYrVBEzEd4JaYYbAkNi5R13YWzDO9ywt2tqsx113TLYybORrKYGURowak/exec";

const produtos=[
  {id:1,nome:'X-Burger',desc:'Pão brioche, carne artesanal e queijo.',preco:18,img:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400',categoria:'Lanches'},
  {id:2,nome:'X-Bacon',desc:'Hambúrguer, queijo e bacon.',preco:22,img:'https://images.unsplash.com/photo-1601050690597-6c0c9f57f3c7?w=400',categoria:'Lanches'},
  {id:3,nome:'Batata Frita',desc:'Porção individual crocante.',preco:12,img:'https://images.unsplash.com/photo-1606756790138-640a2f1f02c0?w=400',categoria:'Acompanhamentos'},
  {id:4,nome:'Anéis de Cebola',desc:'Crocantes e saborosos.',preco:10,img:'https://images.unsplash.com/photo-1601924928361-0f56d1a1f4d2?w=400',categoria:'Acompanhamentos'},
  {id:5,nome:'Refrigerante Lata',desc:'Lata 350ml',preco:6,img:'https://images.unsplash.com/photo-1613470209869-1b4b4a1c1db2?w=400',categoria:'Bebidas'},
  {id:6,nome:'Suco Natural',desc:'Suco de frutas naturais 300ml.',preco:8,img:'https://images.unsplash.com/photo-1577805947697-89e18249d767?w=400',categoria:'Bebidas'}
];

let carrinho=[];
let categoriaAtiva='';

const categoriasDiv=document.getElementById('categorias');
const menuDiv=document.getElementById('menu');
const titulo=document.getElementById('tituloCategoria');

// Cria botões de categoria
const categoriasUnicas=[...new Set(produtos.map(p=>p.categoria))];
categoriasUnicas.forEach((cat,i)=>{
  const btn=document.createElement('button');
  btn.textContent=cat;
  btn.onclick=()=>filtrarCategoria(cat);
  if(i===0){btn.classList.add('active');categoriaAtiva=cat;}
  categoriasDiv.appendChild(btn);
});
filtrarCategoria(categoriaAtiva);

function filtrarCategoria(cat){
  categoriaAtiva=cat;
  titulo.innerText=cat;
  document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('active'));
  [...categoriasDiv.children].find(b=>b.textContent===cat)?.classList.add('active');
  menuDiv.innerHTML='';
  produtos.filter(p=>p.categoria===cat).forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`
      <img src="${p.img}" alt="${p.nome}">
      <div class="card-body">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <span>R$${p.preco.toFixed(2)}</span>
        <button class="add" onclick="addCarrinho(${p.id})">Adicionar</button>
      </div>`;
    menuDiv.appendChild(c);
  });
}

function addCarrinho(id){
  const prod=produtos.find(p=>p.id===id);
  if(carrinho.find(i=>i.id===id)){alert('Item já está no carrinho');return;}
  let obs=prompt('Alguma observação para este item? (opcional)')||'';
  carrinho.push({...prod,obs});
  renderCarrinho();
}

function renderCarrinho(){
  document.getElementById('cart-count').innerText=carrinho.length;
  const div=document.getElementById('cart-items');div.innerHTML='';
  carrinho.forEach((item,i)=>{
    div.innerHTML+=`
      <div class="item-line">
        <span>${item.nome}</span>
        <button onclick="removeItem(${i})">✖</button>
      </div>
      <small>Obs: ${item.obs||'-'}</small>`;
  });
  if(carrinho.length)div.innerHTML+=`<button class="finalizar" onclick="abrirFormCliente()">Continuar</button>`;
}

function removeItem(i){carrinho.splice(i,1);renderCarrinho();}
document.getElementById('cart-btn').onclick=()=>document.getElementById('cart-modal').style.display='flex';
document.getElementById('cart-modal').onclick=e=>{if(e.target.id==='cart-modal')e.target.style.display='none';};

// FORM CLIENTE
function abrirFormCliente(){
  const saved=JSON.parse(localStorage.getItem('cliente')||'{}');
  const form=document.getElementById('formCliente');
  form.style.display='block';
  form.innerHTML=`
    <h3>📋 Dados do Cliente</h3>
    <label>Nome completo</label><input id="nome" value="${saved.nome||''}">
    <label>WhatsApp</label><input id="whats" type="tel" inputmode="numeric" value="${saved.whats||''}">
    <label>CEP</label><input id="cep" inputmode="numeric" maxlength="9" onblur="buscarEndereco()" value="${saved.cep||''}">
    <div id="bairroDetectado" style="font-size:13px;color:var(--muted);margin-top:-6px;"></div>
    <label>Endereço</label><input id="endereco" value="${saved.endereco||''}">
    <label>Número</label><input id="numero" type="number" inputmode="numeric" value="${saved.numero||''}">
    <label>Bairro</label>
    <select id="bairro" onchange="atualizarTotais()">
      <option value="">Selecione</option>
      <option value="Centro" data-taxa="5">Centro - R$5,00</option>
      <option value="Vila Brasil" data-taxa="8">Vila Brasil - R$8,00</option>
      <option value="Santa Luzia" data-taxa="10">Santa Luzia - R$10,00</option>
    </select>
    <label>Forma de pagamento</label>
    <select id="pagamento" onchange="verificarTroco()">
      <option value="">Selecione</option>
      <option value="Pix">Pix</option>
      <option value="Cartão">Cartão</option>
      <option value="Dinheiro">Dinheiro</option>
    </select>
    <div id="campoTroco"></div>
    <div id="infoTotais"></div>
    <button class="finalizar" onclick="mostrarResumo()">Ver Resumo</button>
  `;
  IMask(document.getElementById('whats'), {mask: '(00) 00000-0000'});
}

// CEP via ViaCEP
async function buscarEndereco(){
  const cep=document.getElementById('cep').value.replace(/\D/g,'');
  if(cep.length!=8) return;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j=await r.json();
    if(j.erro) return;
    document.getElementById('endereco').value=`${j.logradouro}, ${j.bairro} - ${j.localidade}`;
    const bairroSel=document.getElementById('bairro');
    let detectado="";
    for(let o of bairroSel.options){
      if(o.value && j.bairro && j.bairro.toLowerCase().includes(o.value.toLowerCase())){
        bairroSel.value=o.value;detectado=o.value;break;
      }
    }
    atualizarTotais();
    const taxa=parseFloat(bairroSel.selectedOptions[0]?.dataset.taxa||0);
    document.getElementById('bairroDetectado').innerHTML=detectado?`📍 Bairro detectado: <strong>${detectado}</strong> — Taxa: R$${taxa.toFixed(2)}`:'';
  }catch(e){console.error(e);}
}

function verificarTroco(){
  const forma=document.getElementById('pagamento').value;
  const c=document.getElementById('campoTroco');
  if(forma==='Dinheiro'){
    c.innerHTML=`
      <label>Precisa de troco?</label>
      <select id="precisaTroco" onchange="this.value==='Sim'?document.getElementById('valorTroco').style.display='block':document.getElementById('valorTroco').style.display='none'">
        <option>Não</option><option>Sim</option>
      </select>
      <input id="valorTroco" inputmode="numeric" placeholder="Troco para quanto?" style="display:none">`;
  }else c.innerHTML='';
}

function atualizarTotais(){
  const b=document.getElementById('bairro');
  const taxa=parseFloat(b.selectedOptions[0]?.dataset.taxa||0);
  const subtotal=carrinho.reduce((s,i)=>s+i.preco,0);
  const total=subtotal+taxa;
  document.getElementById('infoTotais').innerHTML=`
    <p><strong>Taxa:</strong> R$${taxa.toFixed(2)}</p>
    <p><strong>💰 Total:</strong> R$${total.toFixed(2)}</p>`;
}

function mostrarResumo(){
  const nome=document.getElementById('nome').value.trim();
  const whats=document.getElementById('whats').value.trim();
  const cep=document.getElementById('cep').value.trim();
  const endereco=document.getElementById('endereco').value.trim();
  const numero=document.getElementById('numero').value.trim();
  const bairroSel=document.getElementById('bairro');
  const bairro=bairroSel.value;
  const forma=document.getElementById('pagamento').value;
  const precisa=document.getElementById('precisaTroco')?.value||'Não';
  const troco=document.getElementById('valorTroco')?.value||'';
  const taxa=parseFloat(bairroSel.selectedOptions[0]?.dataset.taxa||0);
  const subtotal=carrinho.reduce((s,i)=>s+i.preco,0);
  const total=subtotal+taxa;
  if(!nome||!whats||!bairro||!forma){alert('Preencha todos os campos obrigatórios.');return;}
  document.getElementById('formCliente').innerHTML=`
    <h3>📦 Resumo</h3>
    <p><strong>Cliente:</strong> ${nome}</p>
    <p><strong>Endereço:</strong> ${endereco}, ${numero} - ${bairro}</p>
    <p><strong>Pagamento:</strong> ${forma}${forma==='Dinheiro
'?' ('+(precisa==='Sim'?'Troco p/ '+troco:'Sem troco')+')':''}</p>
    <h3 style="color:var(--accent)">Total: R$${total.toFixed(2)}</h3>
    <button class="finalizar" onclick="enviarPedido('${nome}','${whats}','${cep}','${endereco}','${numero}','${bairro}','${forma}','${precisa}','${troco}',${taxa},${subtotal},${total})">Enviar Pedido</button>`;
}

// 🔹 Envia os dados do pedido para o Apps Script
async function enviarPedido(nome,whats,cep,endereco,numero,bairro,forma,precisa,troco,taxa,subtotal,total){
  document.getElementById('overlay').style.display='flex';
  const payload={
    acao:"adicionar",
    nome,whats,cep,endereco,numero,bairro,forma,precisa,troco,
    itens:carrinho.map(i=>i.nome).join(', '),
    observacoes:carrinho.map(i=>`${i.nome}: ${i.obs}`).join('; '),
    subtotal,taxa,total
  };
  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload)});
    const t=await r.text();
    document.getElementById('overlay').style.display='none';
    if(t.includes("ok")){
      alert("✅ Pedido enviado com sucesso!");
      // Enviar resumo pelo WhatsApp
      const msg=`🍽️ *Novo Pedido Mercatto Delivery*%0A
👤 *Cliente:* ${nome}%0A
📞 *WhatsApp:* ${whats}%0A
🏠 *Endereço:* ${endereco}, ${numero} - ${bairro}%0A
💳 *Pagamento:* ${forma}${forma==='Dinheiro'?(precisa==='Sim'?' (Troco p/ '+troco+')':' (Sem troco)'):''}%0A
--------------------------%0A
${carrinho.map(i=>`• ${i.nome}${i.obs?' ('+i.obs+')':''}`).join('%0A')}%0A
--------------------------%0A
💰 *Subtotal:* R$${subtotal.toFixed(2)}%0A
🚚 *Taxa:* R$${taxa.toFixed(2)}%0A
🧾 *Total:* R$${total.toFixed(2)}%0A
--------------------------%0A
✅ Pedido enviado via site.`;
      const tel="5571999999999"; // substitua pelo número do estabelecimento
      window.open(`https://wa.me/${tel}?text=${msg}`,"_blank");

      carrinho=[];
      document.getElementById('cart-modal').style.display='none';
      renderCarrinho();
    }else{
      alert("❌ Erro ao registrar pedido.");
    }
  }catch(e){
    document.getElementById('overlay').style.display='none';
    alert("Erro de conexão. Tente novamente.");
    console.error(e);
  }
}
</script>

</body>
</html>
